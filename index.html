<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmasave Escarpment Metrics</title>
<!-- Favicon / app icons -->
<link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/favicon/favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/favicon/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/assets/favicon/site.webmanifest">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Firebase compat SDK (no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --navy:#1B3A6B; --teal:#1D9E75; --red:#E05252; --amber:#BA7517;
  --bg:#f0f3f8; --border:#dde2ea; --text:#1a2640; --light:#5a6b84;
  --shadow:0 2px 10px rgba(27,58,107,0.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{background:var(--navy);color:#fff;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.25)}
header h1{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.data-badge{font-size:0.78rem;opacity:.85;white-space:nowrap}
@media(max-width:768px){
  header{height:auto;padding:10px 16px;flex-direction:column;align-items:flex-start;gap:4px}
  header h1{width:100%;text-align:center}
  .hdr-suffix{display:none}
  .hdr-meta{width:100%;gap:10px;justify-content:space-between}
  .hdr-meta .data-badge{font-size:0.7rem}
  .hdr-meta #userDisplay{font-size:0.7rem!important;max-width:120px!important}
  #signOutBtn{min-height:44px!important;padding:2px 14px!important;font-size:0.73rem!important}
}

/* NAV */
nav{background:#fff;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{height:0}
.nav-btn{padding:13px 18px;border:none;background:none;cursor:pointer;font-size:.85rem;color:var(--light);border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;font-weight:500}
.nav-btn:hover{color:var(--navy)}
.nav-btn.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}

/* PAGES */
.page{display:none;padding:24px;max-width:1240px;margin:0 auto}
.page.active{display:block}

/* CARDS */
.card{background:#fff;border-radius:12px;padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
.card-title{font-size:.8rem;font-weight:700;color:var(--navy);margin-bottom:18px;text-transform:uppercase;letter-spacing:.05em}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px;align-items:stretch}
.kpi-card{background:#fff;border-radius:12px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.kpi-card.kpi-std{align-items:center;text-align:center}
.kpi-label{font-size:.71rem;color:var(--light);text-transform:uppercase;letter-spacing:.06em}
.kpi-card.kpi-std .kpi-label{min-height:2.8em;display:flex;align-items:flex-start;justify-content:center}
.kpi-val-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.kpi-value{font-size:1.7rem;font-weight:800;color:var(--navy);line-height:1}
.kpi-value.pos{color:var(--teal)} .kpi-value.neg{color:var(--red)}
.kpi-sub{font-size:.72rem;color:var(--light);margin-top:auto}

/* TOGGLE SWITCH (pill style) */
.pill-toggle{display:inline-flex;background:var(--border);border-radius:10px;padding:3px;gap:3px}
.pill-opt{padding:7px 15px;border:none;background:none;border-radius:8px;cursor:pointer;font-size:.81rem;font-weight:600;color:var(--light);transition:all .18s;white-space:nowrap}
.pill-opt.active{background:#fff;color:var(--navy);box-shadow:0 1px 5px rgba(0,0,0,.13)}

/* FORMS */
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:5px}
.form-row .hint{font-size:.72rem;color:var(--light);margin-top:3px}
input[type=text],input[type=number],input[type=month]{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:.875rem;color:var(--text);outline:none;transition:border-color .15s}
input:focus{border-color:var(--navy)}
.input-prefix{position:relative}
.input-prefix span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--light);font-size:.875rem;pointer-events:none}
.input-prefix input{padding-left:22px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{opacity:.88}
.btn-success{background:var(--teal);color:#fff}.btn-success:hover{opacity:.88}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{opacity:.88}
.btn-ghost{background:var(--border);color:var(--text)}.btn-ghost:hover{opacity:.8}
.btn-sm{padding:6px 12px;font-size:.78rem}
.btn-xs{padding:4px 9px;font-size:.74rem}

/* ALERTS */
.alert{padding:11px 15px;border-radius:8px;font-size:.84rem;margin-bottom:14px}
.alert-success{background:#edfaf4;border:1px solid var(--teal);color:#0e6647}
.alert-warning{background:#fff8e6;border:1px solid var(--amber);color:#7a4d10}

/* GP SUMMARY BOX */
.gp-summary{background:var(--bg);border-radius:10px;padding:16px;margin-top:14px}
.gp-row{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0}
.gp-divider{border-top:1px solid var(--border);margin:8px 0}
.gp-total{font-weight:800;font-size:.95rem;color:var(--navy)}

/* TABLES */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.data-tbl th{background:var(--navy);color:#fff;padding:11px 13px;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.data-tbl td{padding:10px 13px;border-bottom:1px solid var(--border);white-space:nowrap}
.data-tbl tbody tr:hover td{background:#f7f9fc}
.data-tbl .tot-row td{font-weight:700;border-top:2px solid var(--border);background:#f7f9fc}
.pos{color:var(--teal);font-weight:600} .neg{color:var(--red);font-weight:600}

/* EXPENSE TABLE */
.exp-tbl{width:100%;border-collapse:collapse}
.exp-tbl th{text-align:left;padding:8px 12px;font-size:.72rem;color:var(--light);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);font-weight:600}
.exp-tbl td{padding:7px 12px;border-bottom:1px solid var(--border)}
.exp-tbl td input[type=text]{width:180px} .exp-tbl td input[type=number]{width:120px}
.exp-tbl .foot td{font-weight:700;padding-top:12px;border-top:2px solid var(--border);border-bottom:none}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.28)}
.modal-head{position:sticky;top:0;background:#fff;padding:20px 24px 16px;border-bottom:1px solid var(--border);z-index:1;border-radius:16px 16px 0 0}
.modal-head h2{font-size:1.05rem;color:var(--navy)}
.modal-body{padding:20px 24px}
.modal-foot{position:sticky;bottom:0;background:#fff;padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;border-radius:0 0 16px 16px}
.section-divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.sub-fields{background:var(--bg);border-radius:8px;padding:12px 14px;margin-top:8px}

/* CHART */
.chart-wrap{position:relative}

/* SETTINGS */
.setting-block{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.setting-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.setting-label{font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:10px}

/* SPINNER */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* WEEKLY METRICS */
.wk-fab{position:fixed;bottom:28px;right:28px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:1.8rem;line-height:1;cursor:pointer;box-shadow:0 4px 20px rgba(29,158,117,.45);z-index:300;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.wk-fab:hover{transform:scale(1.08)}
.wk-prog-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--light);margin-bottom:3px}
.wk-prog-bar{background:#e0e4ea;border-radius:6px;height:10px;overflow:hidden;margin-bottom:4px}
.wk-prog-fill{height:100%;border-radius:6px;transition:width .4s}
.wk-tip{background:linear-gradient(135deg,#eef4ff,#e8f7f2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:.84rem;color:var(--navy)}
.wk-hit{display:inline-block;background:var(--teal);color:#fff;font-size:.65rem;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:middle}
.wk-src-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
@media(max-width:520px){.wk-src-grid{grid-template-columns:1fr}}

/* EHC MISSION HEADER */
/* ── EHC hero + monthly pace strip (Claude Design: "EHC Hero Redesign") ──
   One navy card: a large goal ring on the left, the mission copy on the right,
   and a darker pace strip underneath carrying the three monthly metrics.
   The pace strip is shared with Weekly Metrics so both pages stay identical. */
.ehero{background:var(--navy);border-radius:20px;color:#fff;overflow:hidden;margin-bottom:16px}
.ehero.code-red{box-shadow:0 0 0 4px rgba(224,82,82,.10);outline:1px solid rgba(255,122,110,.38);outline-offset:-1px}
.ehero-top{display:grid;grid-template-columns:340px 1fr;gap:56px;align-items:center;padding:44px 48px 40px}
.ehero-eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:0 0 14px}
.ehero-h1{margin:0 0 18px;font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.02em;overflow-wrap:break-word}
.ehero-lede{margin:0;font-size:18px;line-height:1.5;color:rgba(255,255,255,.86);max-width:44ch}
.ehero-lede b{color:#fff;font-weight:800}
.ehero-meta{display:flex;align-items:center;gap:14px;margin-top:24px;font-size:13.5px;color:rgba(255,255,255,.55);flex-wrap:wrap}
.ehero-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,.10);border-radius:999px;padding:7px 14px}
.ehero-chip .dot{width:7px;height:7px;border-radius:50%;background:#F5A623;flex:none}
.ehero.code-red .ehero-chip .dot{background:#ff7a6e;animation:ehcPulse 2s ease-in-out infinite}
.ehero-ring{position:relative;width:340px;height:340px;justify-self:center;max-width:100%}
.ehero-ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ehero-ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:0 30px}
.ehero-ring .big{font-size:88px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ehero-ring .cap{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.ehero-ring .sub{font-size:14px;color:rgba(255,255,255,.7);margin-top:8px;font-variant-numeric:tabular-nums}
.ehero-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1)}

/* colour lives on .epace, not on the hero wrapper: the strip also renders
   standalone on Weekly Metrics, where it would otherwise inherit the page's
   dark body text and render the numbers nearly invisible on navy. */
.epace{border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.10);padding:26px 48px 34px;color:#fff}
.ehero .epace{margin:0}
.epace-solo{background:var(--navy);border-radius:20px;margin-bottom:16px;border-top:none}
.epace-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 22px;gap:12px;flex-wrap:wrap}
.epace-head .t{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.epace-head .r{font-size:13.5px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.epace-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.emetric{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.06);border-radius:14px;padding:18px 22px}
.emring{position:relative;width:76px;height:76px;flex:none}
.emring svg{transform:rotate(-90deg);display:block}
.emring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.emring-arc{transition:stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1)}
.emetric .k{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:0 0 6px}
.emetric .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.emetric .n span{color:rgba(255,255,255,.55);font-weight:700;font-size:17px}
.emetric .s{font-size:13px;font-weight:700;margin-top:5px}
.epace-foot{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.6)}

@media(max-width:900px){
  .ehero-top{grid-template-columns:1fr;gap:26px;padding:30px 22px 26px;text-align:center}
  .ehero-ring{width:250px;height:250px;margin:0 auto}
  .ehero-ring .big{font-size:64px}
  .ehero-h1{font-size:32px}
  .ehero-lede{max-width:none;font-size:16px}
  .ehero-meta{justify-content:center}
  .epace{padding:22px 20px 26px}
  .epace-grid{grid-template-columns:1fr;gap:12px}
}
@media(max-width:480px){
  /* the headline is user-editable, so leave room for a longer one */
  .ehero-h1{font-size:26px}
  .ehero-ring{width:210px;height:210px}
  .ehero-ring .big{font-size:54px}
}
@media(prefers-reduced-motion:reduce){
  .ehero-arc,.emring-arc{transition:none}
}
/* Pulse for the Code Red chip dot on the EHC hero */
@keyframes ehcPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,122,110,.45)}50%{opacity:.55;box-shadow:0 0 0 6px rgba(255,122,110,0)}}
@media(prefers-reduced-motion:reduce){.ehero.code-red .ehero-chip .dot{animation:none}}
.ehc-note-card{border-left:4px solid var(--teal)}

/* CELEBRATION */
.celeb-overlay{position:fixed;inset:0;background:rgba(27,58,107,.72);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.celeb-box{background:#fff;border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.3);max-width:360px;animation:celebPop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes celebPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes confettiFall{from{transform:translateY(0) rotate(0deg);opacity:.9}to{transform:translateY(95vh) rotate(450deg);opacity:0}}
#confettiContainer{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}

/* WEEK MODAL */
.week-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:16px}
.week-modal{background:#fff;border-radius:16px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.28)}

/* RESPONSIVE */
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts-row-2{grid-template-columns:1fr!important}.rx-tgt-grid{grid-template-columns:1fr!important}.rx-tgt-divider{display:none!important}.weekly-pb-grid{grid-template-columns:1fr!important}}
@media(max-width:520px){.kpi-grid{grid-template-columns:1fr}.page{padding:14px}}

/* UTILS */
.flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.items-center{align-items:center}.justify-between{justify-content:space-between}.wrap{flex-wrap:wrap}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}
.text-sm{font-size:.84rem}.text-xs{font-size:.72rem}.text-light{color:var(--light)}.font-bold{font-weight:700}
</style>
<style>
/* ============================================================
   NAVY EDITORIAL DASHBOARD (Direction B) — scoped under .dash2
   ============================================================ */
.dash2{
  --b-navy:#1B3A6B; --b-teal:#1D9E75; --b-red:#E05252; --b-amber:#BA7517;
  --b-bg:#edeef4; --b-card:#fcfcfe; --b-ink:#16243d; --b-muted:#5d6b85;
  --b-faint:#93a0b6; --b-line:#e6e8f0; --b-line-strong:#d6deea;
  --b-radius:18px; --b-radius-sm:13px; --b-pad:32px;
  --b-navy-soft:#eef2f8; --b-teal-soft:#e7f5ee; --b-red-soft:#fbeaea; --b-amber-soft:#f7eedd;
  --b-shadow:0 1px 2px rgba(20,40,70,.05), 0 18px 40px -24px rgba(20,40,70,.32);
  --b-font-ui:'Manrope',system-ui,-apple-system,sans-serif;
  --b-font-num:'Newsreader',Georgia,'Times New Roman',serif;
  font-family:var(--b-font-ui); color:var(--b-ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:clamp(16px,2.4vw,30px) clamp(14px,3vw,30px) 40px; background:var(--b-bg);
}
#page-dashboard.page{ padding:0; max-width:1320px; }
.dash2, .dash2 *{ box-sizing:border-box; }
.dash2{ overflow:hidden; border-radius:0; }
.dash2 .num{ font-family:var(--b-font-num); font-weight:500; font-variant-numeric:lining-nums tabular-nums; }
.dash2 .pos{ color:var(--b-teal); } .dash2 .neg{ color:var(--b-red); }
.dash2 .warn{ color:var(--b-amber); } .dash2 .navytxt{ color:var(--b-navy); }

/* toolbar */
.dash2 .toolbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:22px; }
.dash2 .toolbar-title h1{ margin:0; font-size:clamp(20px,2.4vw,25px); font-weight:800; letter-spacing:-0.02em; color:var(--b-ink); }
.dash2 .toolbar-title p{ margin:4px 0 0; color:var(--b-muted); font-size:13.5px; }
.dash2 .toolbar-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.dash2 .monthpick{ display:flex; align-items:center; background:#fff; border:1px solid var(--b-line-strong); border-radius:11px; padding:3px; overflow-x:auto; scrollbar-width:none; max-width:100%; }
.dash2 .monthpick::-webkit-scrollbar{ display:none; }
.dash2 .mbtn{ font:inherit; font-size:13px; font-weight:600; color:var(--b-muted); background:none; border:none; cursor:pointer; padding:7px 12px; border-radius:8px; white-space:nowrap; transition:background .15s,color .15s; }
.dash2 .mbtn:hover{ color:var(--b-ink); }
.dash2 .mbtn.active{ background:var(--b-navy); color:#fff; }
.dash2 .seg{ display:inline-flex; background:#fff; border:1px solid var(--b-line-strong); border-radius:11px; padding:3px; }
.dash2 .seg button{ font:inherit; font-size:12.5px; font-weight:600; color:var(--b-muted); background:none; border:none; cursor:pointer; padding:7px 12px; border-radius:8px; transition:background .15s,color .15s; }
.dash2 .seg button.active{ background:var(--b-navy); color:#fff; }
.dash2 .seg .lab{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--b-faint); align-self:center; padding:0 8px 0 4px; }

/* board / zones */
.dash2 .board{ display:grid; gap:clamp(14px,1.6vw,20px); grid-template-columns:repeat(12,1fr); }
.dash2 .zone-label{ grid-column:1/-1; display:flex; align-items:center; gap:12px; margin:14px 2px 0; }
.dash2 .zone-label:first-child{ margin-top:0; }
.dash2 .zone-label .step{ font-family:var(--b-font-num); font-weight:600; font-size:12px; color:#fff; background:var(--b-navy); width:22px; height:22px; border-radius:7px; display:grid; place-items:center; flex:none; }
.dash2 .zone-label h2{ margin:0; font-size:12.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:var(--b-muted); }
.dash2 .zone-label .rule{ flex:1; height:1px; background:var(--b-line); }
.dash2 .card{ background:var(--b-card); border:1px solid var(--b-line); border-radius:var(--b-radius); box-shadow:var(--b-shadow); margin:0; padding:0; }
.dash2 .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:var(--b-faint); }

/* hero */
.dash2 .hero-now{ grid-column:span 7; padding:var(--b-pad); display:flex; flex-direction:column; }
.dash2 .hero-goal{ grid-column:span 5; padding:var(--b-pad); display:flex; flex-direction:column; background:linear-gradient(160deg,#234a82 0%, var(--b-navy) 70%); color:#fff; border-color:transparent; }
.dash2 .hero-net{ margin-top:18px; }
.dash2 .hero-net .lbl{ font-size:14px; font-weight:600; color:var(--b-muted); }
.dash2 .bignum{ font-family:var(--b-font-num); font-weight:500; line-height:1; font-variant-numeric:lining-nums tabular-nums; }
.dash2 .hero-net .bignum{ font-size:clamp(44px,6vw,64px); margin:6px 0 8px; }
.dash2 .hero-net .sub{ font-size:14px; color:var(--b-muted); }
.dash2 .hero-now-row{ margin-top:auto; padding-top:24px; display:flex; gap:14px; flex-wrap:wrap; }
.dash2 .hero-now-row > div{ flex:1; min-width:120px; border-top:1px solid var(--b-line); padding-top:14px; }
.dash2 .mini-label{ display:block; font-size:12px; font-weight:600; color:var(--b-faint); margin-bottom:5px; }
.dash2 .mini-num{ font-family:var(--b-font-num); font-weight:500; font-size:21px; font-variant-numeric:lining-nums tabular-nums; color:var(--b-ink); }
.dash2 .pill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--b-font-ui); font-size:13px; font-weight:700; padding:5px 11px; border-radius:999px; }
.dash2 .pill.amber{ background:var(--b-amber-soft); color:var(--b-amber); }
.dash2 .pill.teal{ background:var(--b-teal-soft); color:var(--b-teal); }
.dash2 .pill.red{ background:var(--b-red-soft); color:var(--b-red); }
.dash2 .pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

/* goal panel (navy) */
.dash2 .hero-goal .eyebrow{ color:rgba(255,255,255,.62); }
.dash2 .hero-goal .mini-label{ color:rgba(255,255,255,.62); }
.dash2 .goal-top{ display:flex; align-items:stretch; justify-content:space-between; gap:14px; flex:1; }
.dash2 .goal-value .bignum{ font-size:clamp(34px,4.2vw,42px); margin:6px 0 6px; color:#fbd98a; }
.dash2 .goal-value .hint{ font-size:12.5px; color:rgba(255,255,255,.55); }
.dash2 .goal-arrival{ text-align:right; }
.dash2 .goal-arrival .midnum{ font-family:var(--b-font-num); font-weight:500; font-size:26px; color:#fff; margin:5px 0 4px; }
.dash2 .goal-arrival .hint{ font-size:11.5px; color:rgba(255,255,255,.55); max-width:160px; margin-left:auto; }
.dash2 .ring-wrap{ display:flex; align-items:center; gap:18px; margin-top:24px; padding-top:24px; border-top:1px solid rgba(255,255,255,.16); }
.dash2 .ring{ width:96px; height:96px; flex:none; }
.dash2 .ring-track{ stroke:rgba(255,255,255,.16); }
.dash2 .ring-fill{ stroke:#f3b64a; transition:stroke-dashoffset 1s cubic-bezier(.22,.61,.36,1); }
.dash2 .ring-pct{ font-family:var(--b-font-num); font-weight:600; fill:#fff; }
.dash2 .ring-meta{ font-size:13px; color:rgba(255,255,255,.7); line-height:1.5; }
.dash2 .ring-meta b{ color:#fff; font-weight:600; }

/* KPI strip */
.dash2 .kpi{ grid-column:span 4; padding:22px 24px; display:flex; flex-direction:column; gap:2px; }
.dash2 .kpi .k-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.dash2 .kpi .k-label{ font-size:12.5px; font-weight:600; color:var(--b-muted); }
.dash2 .kpi .k-num{ font-family:var(--b-font-num); font-weight:500; font-size:30px; line-height:1.05; margin-top:9px; font-variant-numeric:lining-nums tabular-nums; }
.dash2 .kpi .k-sub{ font-size:12.5px; color:var(--b-faint); margin-top:6px; }
.dash2 .k-chip{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
.dash2 .k-chip.up{ background:var(--b-teal-soft); color:var(--b-teal); }
.dash2 .k-chip.down{ background:var(--b-red-soft); color:var(--b-red); }
.dash2 .k-chip.flat{ background:var(--b-navy-soft); color:var(--b-navy); }

/* next month */
.dash2 .next-main{ grid-column:span 7; padding:var(--b-pad); }
.dash2 .next-side{ grid-column:span 5; padding:var(--b-pad); display:flex; flex-direction:column; }
.dash2 .next-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
.dash2 .next-head .eyebrow{ color:var(--b-muted); }
.dash2 .next-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.dash2 .proj{ background:#f1f3f9; border-radius:var(--b-radius-sm); padding:18px; }
.dash2 .proj .p-lbl{ font-size:12.5px; color:var(--b-muted); font-weight:600; }
.dash2 .proj .p-num{ font-family:var(--b-font-num); font-weight:500; font-size:27px; margin:8px 0 6px; font-variant-numeric:lining-nums tabular-nums; }
.dash2 .proj .p-sub{ font-size:11.5px; color:var(--b-faint); }
.dash2 .note{ display:flex; gap:11px; align-items:center; margin-top:18px; padding:14px 16px; border-radius:var(--b-radius-sm); background:var(--b-teal-soft); border-left:3px solid var(--b-teal); font-size:14px; color:#1a6b50; font-style:italic; font-weight:500; }
.dash2 .target-block{ border-bottom:1px solid var(--b-line); padding:18px 0; }
.dash2 .target-block:first-of-type{ padding-top:4px; }
.dash2 .target-block:last-of-type{ border-bottom:none; padding-bottom:4px; }
.dash2 .target-block .t-lbl{ font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--b-faint); }
.dash2 .target-block .t-num{ font-family:var(--b-font-num); font-weight:500; font-size:30px; color:var(--b-amber); margin:7px 0 6px; font-variant-numeric:lining-nums tabular-nums; }
.dash2 .target-block .t-desc{ font-size:12.5px; color:var(--b-muted); line-height:1.5; }
.dash2 .target-block .t-flag{ font-size:13px; font-weight:700; margin-top:8px; }
.dash2 .assume-toggle{ margin-top:16px; }
.dash2 .assume-btn{ font:inherit; font-size:12.5px; font-weight:600; color:var(--b-navy); background:none; border:none; cursor:pointer; padding:0; display:inline-flex; align-items:center; gap:6px; }
.dash2 .assume-btn .chev{ transition:transform .2s; font-size:10px; }
.dash2 .assume-btn.open .chev{ transform:rotate(90deg); }
.dash2 .assume-body{ font-size:12px; color:var(--b-faint); line-height:1.7; margin-top:10px; display:none; }
.dash2 .assume-body.open{ display:block; }

/* trends */
.dash2 .trend-main{ grid-column:span 8; padding:var(--b-pad); display:flex; flex-direction:column; }
.dash2 .trend-side{ grid-column:span 4; padding:var(--b-pad); display:flex; flex-direction:column; }
.dash2 .trend-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.dash2 .trend-head h3{ margin:0; font-size:15px; font-weight:700; letter-spacing:-0.01em; color:var(--b-ink); }
.dash2 .chart-box{ position:relative; flex:1; min-height:300px; }
.dash2 .chart-box canvas{ position:absolute; inset:0; }
.dash2 .hidden{ display:none !important; }
.dash2 .donut-box{ position:relative; height:230px; margin:6px 0 14px; }
.dash2 .legend{ display:flex; flex-direction:column; gap:9px; margin-top:auto; }
.dash2 .legend .lrow{ display:flex; align-items:center; gap:10px; font-size:13px; }
.dash2 .legend .sw{ width:11px; height:11px; border-radius:3px; flex:none; }
.dash2 .legend .lname{ color:var(--b-muted); flex:1; }
.dash2 .legend .lval{ font-family:var(--b-font-num); font-weight:500; color:var(--b-ink); font-variant-numeric:lining-nums tabular-nums; }
.dash2 .legend .lpct{ color:var(--b-faint); font-size:12px; width:42px; text-align:right; }

/* density: compact hides secondary detail */
.dash2[data-density="compact"] .k-sub,
.dash2[data-density="compact"] .proj .p-sub,
.dash2[data-density="compact"] .target-block .t-desc,
.dash2[data-density="compact"] .assume-toggle,
.dash2[data-density="compact"] .goal-arrival .hint,
.dash2[data-density="compact"] .goal-value .hint,
.dash2[data-density="compact"] .hero-net .sub{ display:none; }

@media (max-width:1080px){
  .dash2 .hero-now,.dash2 .hero-goal,.dash2 .next-main,.dash2 .next-side,.dash2 .trend-main,.dash2 .trend-side{ grid-column:1/-1; }
  .dash2 .kpi{ grid-column:span 6; }
}
@media (max-width:720px){
  .dash2{ --b-pad:22px; }
  .dash2 .kpi{ grid-column:1/-1; }
  .dash2 .next-grid{ grid-template-columns:1fr; }
  .dash2 .toolbar{ align-items:stretch; }
  .dash2 .goal-top{ flex-direction:column; gap:14px; }
  .dash2 .goal-arrival{ text-align:left; }
  .dash2 .goal-arrival .hint{ margin-left:0; max-width:none; }
  .dash2 .hero-now-row > div{ flex:1 1 42%; min-width:0; }
}
@media (prefers-reduced-motion: reduce){ .dash2 .ring-fill{ transition:none; } }

.pj{color-scheme:dark;--bg:#0b1830;--card:#11264a;--ink:#fff;--mut:rgba(255,255,255,.68);--fnt:rgba(255,255,255,.56);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--line3:rgba(255,255,255,.32);--soft:rgba(255,255,255,.04);--soft2:rgba(255,255,255,.07);--hover:rgba(255,255,255,.05);--track:rgba(255,255,255,.09);--sw-off:rgba(255,255,255,.18);--tab-bg:#0e1f3d;--tip-bg:#081226;--input-bg:#0a1529;--on-bg:#fff;--on-ink:#0b1830;--card-shadow:none;--shadow:0 14px 30px -12px rgba(0,0,0,.7);--amber:#F5A623;--amber-t:#F5A623;--green:#22C08A;--gt:#3fe0a6;--red:#ff7a6e;--navy:#1B3A6B;--ch-ink:#ffffff;--ch-ink-rgb:255,255,255;--ch-bg:#0b1830;--ch-amber:#F5A623;--ch-amber-t:#F5A623;--ch-green:#3fe0a6;--ch-green-t:#3fe0a6;--ch-red:#ff7a6e;--ch-red-t:#ff7a6e;--ch-val:#9cc2ff;--ch-val-t:#9cc2ff;--ch-glow:1;--ch-axis:rgba(255,255,255,.56)}

.pj .LC .gs b{font-size:16px}

.pj .lc-moves{order:4}

.pj .lc-plans{order:6}
.pj .LC .tcard{order:7}

.pj .LC .chart{height:clamp(360px,calc(100vh - 420px),560px)}}

async function loadState() {
  // allSettled so a permission-denied on one doc (e.g. restricted users
  // can't read pharmasave/months) doesn't block the others.
  const results = await Promise.allSettled([
    db.collection(FS_COL).doc(FS_SETTINGS).get(),
    db.collection(FS_COL).doc(FS_MONTHS).get(),
    db.collection(FS_COL).doc(FS_WEEKLY_DATA).get(),
    db.collection(FS_COL).doc(FS_WEEKLY_TARGETS).get(),
  ]);
  const get = (r) => (r.status === 'fulfilled' ? r.value : null);
  const sDoc = get(results[0]), mDoc = get(results[1]);
  const wDoc = get(results[2]), wtDoc = get(results[3]);

  // Throw if ALL reads were denied (genuine auth failure, not partial access)
  if (!sDoc && !mDoc && !wDoc && !wtDoc) {
    const err = results.find(r => r.status === 'rejected');
    if (err) throw err.reason;
  }

  const s  = sDoc  && sDoc.exists  ? sDoc.data()  : null;
  const m  = mDoc  && mDoc.exists  ? mDoc.data()  : null;
  const w  = wDoc  && wDoc.exists  ? wDoc.data()  : null;
  const wt = wtDoc && wtDoc.exists ? wtDoc.data() : null;
  settings      = s  ? mergeDeep(DEFAULT_SETTINGS, s) : deepClone(DEFAULT_SETTINGS);
  months        = m  ? m.months    : (mDoc ? SAMPLE_MONTHS.map(x => ({...x})) : []);
  weeklyEntries = w  ? w.weeks     : [];
  weeklyTargets = wt ? wt.targets  : [];
  months.sort((a,b) => a.monthKey.localeCompare(b.monthKey));
}

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function mergeDeep(def, saved) {
  const out = deepClone(def);
  for (const k of Object.keys(saved)) {
    if (k in out && typeof out[k] === 'object' && !Array.isArray(out[k])) {
      out[k] = mergeDeep(out[k], saved[k]);
    } else {
      out[k] = saved[k];
    }
  }
  return out;
}

function calcTotalExpenses() {
  if (settings.expenseMethod === 'lump') return parseFloat(settings.lumpExpenses) || 0;
  return (settings.itemizedExpenses||[]).reduce((s,e)=>s+(parseFloat(e.amount)||0), 0);
}

function calcMonthData(m) {
  // Rx GP
  let rxGP;
  if (settings.rxGPMethod === 'fee_markup') {
    rxGP = (parseFloat(m.rxGP_fees)||0) + (parseFloat(m.rxGP_markup)||0);
  } else {
    const pct = (m.rxGP_pct !== undefined ? parseFloat(m.rxGP_pct) : settings.rxGPPct) || 0;
    rxGP = (parseFloat(m.rxSales)||0) * pct / 100;
  }

  // Front Store GP
  let frontGP;
  if (settings.frontGPMethod === 'pct') {
    const pct = (m.frontGP_pct !== undefined ? parseFloat(m.frontGP_pct) : settings.frontGPPct) || 0;
    frontGP = (parseFloat(m.frontSales)||0) * pct / 100;
  } else {
    frontGP = parseFloat(m.frontGP_actual) || 0;
  }

  const rebate   = settings.rebateMethod === 'pct'
    ? (parseFloat(m.rxSales)||0) * (parseFloat(settings.rebatePct)||0) / 100
    : parseFloat(m.rebate) || 0;
  const totalGP  = rxGP + frontGP + rebate;
  const totalExp = parseFloat(m.expenses) || 0;
  const netProfit = totalGP - totalExp;

  return { rxGP, frontGP, rebate, totalGP, totalExp, netProfit };
}

function calcRollingAvgGrowth() {
  const sorted = [...months].sort((a,b) => a.monthKey.localeCompare(b.monthKey));
  const slice  = sorted.slice(-GROWTH_WINDOW_MONTHS);

  if (slice.length < 2) return {rate: null, count: slice.length, trend: null, rates: []};

  const rates = [];
  for (let i = 1; i < slice.length; i++) {
    const prevGP = calcMonthData(slice[i-1]).totalGP;
    const currGP = calcMonthData(slice[i]).totalGP;
    if (prevGP <= 0) continue; // skip division by zero
    rates.push((currGP - prevGP) / prevGP * 100);
  }

  if (rates.length === 0) return {rate: null, count: slice.length, trend: null, rates: []};

  const avg = rates.reduce((s,r) => s + r, 0) / rates.length;

  // Compound (geometric) monthly rate across the same window. Averaging
  // month-over-month percentages arithmetically overstates compounding — e.g.
  // +100% then -50% averages to +25% but nets to 0% — so anything that projects
  // forward must use this figure, not the simple mean.
  const firstGP = calcMonthData(slice[0]).totalGP;
  const lastGP  = calcMonthData(slice[slice.length-1]).totalGP;
  const cagr = (firstGP > 0 && lastGP > 0 && slice.length > 1)
    ? (Math.pow(lastGP / firstGP, 1/(slice.length-1)) - 1) * 100
    : avg;

  // Trend: compare first-half avg vs second-half avg of the growth rates
  let trend = 'stable';
  if (rates.length >= 2) {
    const mid      = Math.ceil(rates.length / 2);
    const firstAvg = rates.slice(0, mid).reduce((s,r)=>s+r,0) / mid;
    const lastAvg  = rates.slice(-mid).reduce((s,r)=>s+r,0) / mid;
    const diff = lastAvg - firstAvg;
    if      (diff >  0.5) trend = 'accelerating';
    else if (diff < -0.5) trend = 'decelerating';
  }

  return {rate: parseFloat(cagr.toFixed(1)), arithRate: parseFloat(avg.toFixed(1)),
          count: slice.length, trend, rates};
}

// If realisticIsAuto is true, keep the Realistic rate synced to the rolling average.
function syncRealisticRate() {
  if (settings.realisticIsAuto === false) return;
  const avg = calcRollingAvgGrowth();
  if (avg.rate !== null) {
    settings.growthRates.realistic = avg.rate;
    saveSettings();
  }
}

// ================================================================
// PROJECTION RATES
// ================================================================

// Effective Rx GP & Rebate rates (per $1 of Rx Sales) shown in the Settings
// rate-basis preview; keep in step with dashRatesUpTo, which the dashboard's
// targets use. (The Projections page measures its own 3-month rates.) Honors
// the rateBasis setting:
//   'avg'    → derive from a trailing window of REAL month data (fee+markup,
//              actual rebate $). Most accurate when you enter real numbers.
//   'manual' → use the static Rx GP % / Rebate % from Settings.
// Returns { rxGPRate, rebRate, source, window } with rates as decimals.
function projectionRates() {
  const win = parseInt(settings.avgWindow) || 6;
  if (settings.rateBasis === 'avg' && months.length) {
    const slice = months.slice(-win);
    let sumRx = 0, sumGP = 0, sumReb = 0;
    slice.forEach(m => {
      const rx = parseFloat(m.rxSales) || 0;
      // Real Rx GP dollars: prefer dispensing fee + markup, else fall back to %
      const fm = (parseFloat(m.rxGP_fees) || 0) + (parseFloat(m.rxGP_markup) || 0);
      const gp = fm > 0
        ? fm
        : rx * ((m.rxGP_pct !== undefined ? parseFloat(m.rxGP_pct) : settings.rxGPPct) || 0) / 100;
      // Real rebate dollars: prefer the actual amount entered, else fall back to %
      let reb = parseFloat(m.rebate);
      if (!(reb > 0)) reb = rx * (settings.rebatePct || 0) / 100;
      sumRx += rx; sumGP += gp; sumReb += reb;
    });
    if (sumRx > 0) {
      return { rxGPRate: sumGP / sumRx, rebRate: sumReb / sumRx, source: 'avg', window: slice.length };
    }
  }
  // Manual / fallback
  return {
    rxGPRate: (settings.rxGPPct || 0) / 100,
    rebRate:  settings.rebateMethod === 'pct' ? (settings.rebatePct || 0) / 100 : 0,
    source:   'manual',
    window:   0,
  };
}

}
function fmtPct(n) { return (parseFloat(n)||0).toFixed(1) + '%'; }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseDollar(s) { return parseFloat(String(s||'').replace(/[$,\s]/g,'')) || 0; }
function monthKeyToLabel(key) {

  const allowed = p => !!userRecord && userRecord.pages.includes(p.name);

  const first = PAGE_MAP.find(allowed);

function navigate(page) {
  // Access guard — silently redirect to the landing page if not permitted
  if (userRecord) {
    const entry = PAGE_MAP.find(p => p.id === page);
    if (entry && !userRecord.pages.includes(entry.name)) page = landingPage();
  }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  const btn = document.querySelector('.nav-btn[data-page="' + page + '"]');
  if (btn) btn.classList.add('active');
  currentPage = page;
  renderPage(page);
  updateBadge();

// ── model.js ─────────────────────────────────────────────────────
function pjBuildModel(D, multiple) {

  // stay right even if an older month is missing from the history.

  const M0 = ((T0 % 12) + 12) % 12, Y0 = Math.floor(T0 / 12);
  const S = { multiple, target: 1e6 };
  const WINDOWS = [{id:'all',label:'All time',n:D.length,name:'all time'},{id:'year',label:'Past year',n:12,name:'the past year'},{id:'six',label:'Past 6 mo',n:6,name:'the past 6 months'},{id:'three',label:'Past 3 mo',n:3,name:'the past 3 months'}];
  const mIdx = i => i>=0&&i<=L ? Number(D[i].key.slice(5))-1 : (((M0+i)%12)+12)%12;   // 0-11
  const lab = (i,s) => { let m,y; if(i>=0&&i<=L){[y,m]=D[i].key.split('-').map(Number);m=MN[m-1]}else{const t=M0+i;m=MN[((t%12)+12)%12];y=Y0+Math.floor(t/12)} return s?m+" '"+String(y).slice(2):m+' '+y; };
  const win = id => WINDOWS.find(w=>w.id===id);
  function slope(a){const n=a.length,xm=(n-1)/2,ym=a.reduce((s,v)=>s+v,0)/n;let sxy=0,sxx=0;a.forEach((y,x)=>{sxy+=(x-xm)*(y-ym);sxx+=(x-xm)*(x-xm)});return sxx?sxy/sxx:0}
  // Rx Count was added to the data later than the dollar figures, so some months
  // have none. The count trend fits only months that have one, at their real
  // positions; per-Rx figures below divide dollars by scripts from the SAME months.
  function slopeXY(pts){const n=pts.length;if(n<2)return 0;const xm=pts.reduce((a,p)=>a+p[0],0)/n,ym=pts.reduce((a,p)=>a+p[1],0)/n;let sxy=0,sxx=0;pts.forEach(([x,y])=>{sxy+=(x-xm)*(y-ym);sxx+=(x-xm)*(x-xm)});return sxx?sxy/sxx:0}
  function fit(id){const n=Math.min(win(id).n,D.length),s=D.slice(-n);return{n,from:s[0].label,net:slope(s.map(d=>d.net)),gp:slope(s.map(d=>d.gp)),exp:slope(s.map(d=>d.exp)),cnt:slopeXY(s.filter(d=>d.cnt>0).map(d=>[d.i,d.cnt])),rx:slope(s.map(d=>d.rx))}}
  const counted = D.filter(d => d.cnt > 0), c0 = counted.length ? counted[counted.length - 1] : null;
  const valNet = () => S.target/(12*S.multiple), value = n => n*12*S.multiple;
  const f$ = v => (v<0?'−':'')+'$'+Math.round(Math.abs(v)).toLocaleString('en-US');
  const fs = v => (v>=0?'+':'−')+'$'+Math.round(Math.abs(v)).toLocaleString('en-US');
  const trim = s => s.includes('.')?s.replace(/\.?0+$/,''):s;
  const fK = v => {const a=Math.abs(v),s=v<0?'−':'';return a>=1e6?s+'$'+trim((a/1e6).toFixed(2))+'M':a>=1e3?s+'$'+trim((a/1e3).toFixed(1))+'K':s+'$'+Math.round(a)};
  const f2 = v => '$'+v.toFixed(2);
  // 3-month averages. Without Rx Count data there is no per-Rx figure, so these
  // return 0 rather than NaN; the Rx-based moves then show as unavailable.
  const last3 = () => D.slice(-3), sum = (s,k) => s.reduce((a,d)=>a+d[k],0);
  function gpPerRx(){const s=counted.slice(-3),c=sum(s,'cnt');return c>0?sum(s,'gp')/c:0}
  function rxValue(){const s=counted.slice(-3),c=sum(s,'cnt');return c>0?sum(s,'rx')/c:0}
  function rebRate(){const s=last3(),r=sum(s,'rx');return r>0?Math.round(sum(s,'reb')/r*1000)/10:0}
  const targets = () => [{id:'be',label:'Break-even',tag:'Break-even',net:0}].concat(Array.from({length:10},(_,i)=>i+1).map(n=>({id:n+'0k',label:`$${n}0K / month`,tag:`$${n}0K/mo`,net:n*1e4})));
  function valLines(max){const u=1e6/(12*S.multiple),c=Math.floor(max/u),sp=c<=5?1:c<=10?2:5,o=[];for(let m=1;m*u<=max;m++)if(m===1||m%sp===0)o.push({v:m*1e6,net:m*u,tag:`$${m}M value`});return o}
  const A = {rxPerBlister:5,frontMargin:.4};
  function plan(id,lv){lv=lv||{};const f=fit(id),gpr=gpPerRx(),rxv=rxValue(),r0=rebRate(),d=D[L],n=(lv.blister||0)*A.rxPerBlister+(lv.rx||0),dr=lv.rebate!=null?(lv.rebate-r0)/100:0,eS=lv.flat?0:f.exp;
    const cnt=k=>c0?c0.cnt+f.cnt*(L+k-c0.i)+n*k:0,rxs=k=>d.rx+f.rx*k+n*k*rxv;   // count runs on from the last month that has one
    const gp=k=>d.gp+f.gp*k+n*k*gpr+dr*rxs(k)+(lv.front||0)*A.frontMargin;
    const exp=k=>d.exp+eS*k-(lv.cut||0)+(lv.add||0);

  function solve(id,lv,t,k){const p=plan(id,lv),G=t-p.at(k);if(G<=0)return{met:true,room:-G,p};
    const gpr=gpPerRx(),rxv=rxValue(),r0=rebRate(),r=lv.rebate!=null?lv.rebate:r0,per=gpr+(r-r0)/100*rxv;
    return{met:false,gap:G,p,need:{flat:lv.flat||p.f.exp<=0?null:p.f.exp*k,cut:(lv.cut||0)+Math.ceil(G/50)*50,blister:(lv.blister||0)+Math.ceil(G/(k*A.rxPerBlister*per)),rx:(lv.rx||0)+Math.ceil(G/(k*per)/5)*5,rebate:p.rxs(k)>0?Math.round((r+Math.ceil(G/p.rxs(k)*1000)/10)*10)/10:Infinity,front:(lv.front||0)+Math.ceil(G/A.frontMargin/100)*100}}}

// ── levers.js ────────────────────────────────────────────────────
function pjTheme() {
  let t = null;
  try { t = localStorage.getItem(PJ_THEME_KEY); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  return t;
}

function pjLoadState(PM) {
  if (!_pj.st) {
    let st = null;
    try { st = JSON.parse(localStorage.getItem(PJ_KEY) || 'null'); } catch (e) {}
    if (!st || !st.lv || !PM.win(st.w)) st = { w:'six', goal:'10k', k:5, lv:{} };
    st.lv = Object.assign({}, PJ_LV0, st.lv);
    st.k = Math.max(1, Math.min(PJ_KMAX, st.k || 6));
    if (!PM.targets().some(m => m.id === st.goal && m.net > 0)) st.goal = '10k';
    _pj.st = st;
  }
  // The goal is kept as an absolute month (t), so adding a month of data never
  // slides it; k, the offset the stepper and drawing use, follows from it.
  const st = _pj.st;
  if (typeof st.t !== 'number' || !isFinite(st.t)) st.t = PM.lastAbs + st.k;
  st.k = pjKFor(PM, st.t);
}
const pjKFor      = (PM, t) => Math.max(1, Math.min(PJ_KMAX, t - PM.lastAbs));
const pjPlanOff   = p => typeof p.t === 'number' ? p.t - _pj.PM.lastAbs : (+p.k || 6);   // older plans stored only k
const pjSave      = () => { try { localStorage.setItem(PJ_KEY, JSON.stringify(_pj.st)); } catch (e) {} };

// ── Saved plans: shared through Firestore ─────────────────────────
// One doc, pharmasave/projectionPlans, so plans follow you between devices and
// everyone with Projections sees the same list. Each plan is its own key in a
// map, so two devices saving at once never overwrite each other's plans. The
// working goal and moves stay per browser (localStorage), as in the design.
const pjPlansRef = () => db.collection(FS_COL).doc(FS_PLANS);
const pjNewId    = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Plans are written by other people's browsers too: never trust their shape.
function pjCleanPlan(id, p) {
  if (!p || typeof p !== 'object') return null;
  const src = p.lv && typeof p.lv === 'object' ? p.lv : {}, lv = Object.assign({}, PJ_LV0);
  ['cut','add','blister','rx','front'].forEach(k => { const v = Number(src[k]); lv[k] = isFinite(v) ? Math.min(PJ_MAX[k], Math.max(0, v)) : 0; });
  lv.flat = src.flat === true;
  const r = Number(src.rebate);
  lv.rebate = src.rebate != null && isFinite(r) ? Math.min(PJ_MAX.rebate, Math.max(0, r)) : null;
  const plan = { id: String(id), name: String(p.name || 'Untitled plan').slice(0, 48), w: String(p.w || 'six'), goal: String(p.goal || '10k'),
                 k: isFinite(Number(p.k)) ? Number(p.k) : 6, lv,
                 savedAt: typeof p.savedAt === 'string' ? p.savedAt : '', savedBy: typeof p.savedBy === 'string' ? p.savedBy : '' };
  if (isFinite(Number(p.t)) && p.t !== null && p.t !== '') plan.t = Number(p.t);
  return plan;
}
const pjPlanDoc   = p => { const d = { name: p.name, w: p.w, goal: p.goal, k: p.k, lv: Object.assign({}, PJ_LV0, p.lv), savedAt: p.savedAt, savedBy: p.savedBy }; if (typeof p.t === 'number') d.t = p.t; return d; };
const pjSortPlans = a => a.sort((x, y) => (x.savedAt || '').localeCompare(y.savedAt || '') || x.name.localeCompare(y.name));

async function pjFetchPlans() {
  const gen = _pj.plansGen;
  try {
    const snap = await pjPlansRef().get();
    const map  = snap.exists ? ((snap.data() || {}).plans || {}) : {};
    if (gen !== _pj.plansGen) return;   // a save or delete happened meanwhile; its own state is newer
    _pj.plans = pjSortPlans(Object.keys(map).map(id => pjCleanPlan(id, map[id])).filter(Boolean));
    _pj.plansState = 'ok';
    await pjMigrateLocalPlans();
  } catch (e) {
    console.warn('[Projections] could not load saved plans:', e.code || e.message);
    if (gen === _pj.plansGen) _pj.plansState = 'error';
  }
  if (_pj.PM && pjRoot()) pjDrawPlans();
}

// Plans saved before they synced lived only in this browser. Upload any whose
// name is not already shared, then forget the local copy.
async function pjMigrateLocalPlans() {
  let local = null;
  try { local = JSON.parse(localStorage.getItem(PJ_PKEY) || 'null'); } catch (e) {}
  if (!Array.isArray(local) || !local.length) return;
  const names = new Set(_pj.plans.map(p => p.name)), add = {}, added = [];
  local.forEach(lp => {
    const c = pjCleanPlan(pjNewId(), Object.assign({}, lp, { savedAt: new Date().toISOString(), savedBy: (auth.currentUser && auth.currentUser.email) || '' }));
    if (c && !names.has(c.name)) { names.add(c.name); add[c.id] = pjPlanDoc(c); added.push(c); }
  });
  try {
    if (added.length) await pjPlansRef().set({ plans: add }, { merge: true });
    try { localStorage.removeItem(PJ_PKEY); } catch (e) {}
    if (added.length) { _pj.plans = pjSortPlans(_pj.plans.concat(added)); console.log('[Projections] Moved', added.length, 'local plan(s) to Firestore'); }
  } catch (e) {
    console.warn('[Projections] local plans not uploaded yet:', e.code || e.message);   // kept locally; retried next visit
  }
}

async function pjSavePlan(plan) {
  const before = _pj.plans ? _pj.plans.slice() : [];
  _pj.plansGen++;
  const list = (_pj.plans || []).filter(p => p.id !== plan.id);
  _pj.plans = pjSortPlans(list.concat([plan]));
  pjDrawPlans();
  try {
    await pjPlansRef().set({ plans: { [plan.id]: pjPlanDoc(plan) } }, { merge: true });
  } catch (e) {
    _pj.plansGen++;
    _pj.plans = before; pjDrawPlans();
    alert('Could not save "' + plan.name + '": ' + (e.code === 'permission-denied' ? 'your account is not allowed to change shared data.' : (e.code || e.message)));
  }
}

async function pjDeletePlan(id) {
  const before = _pj.plans ? _pj.plans.slice() : [];
  const gone = before.find(p => p.id === id);
  if (!gone) return;
  _pj.plansGen++;
  _pj.plans = before.filter(p => p.id !== id);
  pjDrawPlans();
  try {
    await pjPlansRef().update(new firebase.firestore.FieldPath('plans', id), firebase.firestore.FieldValue.delete());
  } catch (e) {
    _pj.plansGen++;
    _pj.plans = before; pjDrawPlans();
    alert('Could not delete "' + gone.name + '": ' + (e.code === 'permission-denied' ? 'your account is not allowed to change shared data.' : (e.code || e.message)));
  }
}

  set('tfoot',`<tr><td>Next 12 months<span class="tag">${PM.lab(L+1,true)} – ${PM.lab(L+12,true)}</span></td><td>${PM.hasCnt?Math.round(c).toLocaleString('en-US'):'—'}</td><td>${f$(rs)}</td><td>${f$(g)}</td><td>${f$(e)}</td><td class="net${n>0?' hit':''}">${f$(n)}</td><td></td></tr>`)}
 set('method',`Trend: least-squares slope over ${f.n} months (${f.from} – ${d.label}) for net profit, gross profit, expenses, Rx count and Rx sales, extended from ${d.label}. Moves start in ${PM.lab(L+1)}. Assumptions: ${f2(gpr)} GP and ${f2(PM.rxValue())} in sales per Rx (3-mo avg), ${A.rxPerBlister} Rx per blister pack patient, ${r0.toFixed(1)}% rebate rate (3-mo avg), ${Math.round(A.frontMargin*100)}% front-store margin (estimate). Valuation = monthly net profit × 12 × ${PM.S.multiple}, set in Settings; dotted lines mark each $1M of value ($1M = ${f$(PM.valNet())}/mo net profit).${D.length<=12?' All time and Past year match until there are 13+ months of data.':''}`);
 q('[data-act="reset"]').disabled=!pjMovesList(lv).length;pjDrawPlans();
 pjSave();
}

// Listeners live on the page element, which survives re-renders; they are
// attached once and ignore events while the page shows its empty state.
function pjBind(page) {
  if (page._pjBound) return;
  page._pjBound = true;
  page.addEventListener('click', e => {
    const th = e.target.closest && e.target.closest('[data-theme-set]');
    if (th) {
      const r = pjRoot(); if (!r) return;
      r.dataset.theme = th.dataset.themeSet;
      try { localStorage.setItem(PJ_THEME_KEY, r.dataset.theme); } catch (_) {}
      if (_pj.PM) { _pj.pendingDel = null; pjDraw(); }
      return;
    }
    if (!_pj.PM) return;
    const t = e.target.closest('[data-w],[data-act],[data-apply]');
    if (_pj.pendingDel != null && !(t && t.dataset.act === 'del')) { _pj.pendingDel = null; pjDrawPlans(); }
    if (!t) return;
    const st = _pj.st;
    if (t.dataset.w) st.w = t.dataset.w;
    else if (t.dataset.apply) { const x = t.dataset.apply; st.lv[x] = x === 'flat' ? true : pjClamp(x, +t.dataset.v); }
    else {
      const a = t.dataset.act;
      if (a === 'save-open') { pjOpenSave(true); return; }
      if (a === 'save-cancel') { pjOpenSave(false); return; }
      if (a === 'del') { const id = t.dataset.id; if (_pj.pendingDel === id) { _pj.pendingDel = null; pjDeletePlan(id); } else { _pj.pendingDel = id; pjDrawPlans(); } return; }
      if (a === 'load') { const p = (_pj.plans || []).find(x => x.id === t.dataset.id); if (!p) return; const GS = pjGoalTags(), k = pjKFor(_pj.PM, _pj.PM.lastAbs + pjPlanOff(p)); _pj.st = { w: _pj.PM.win(p.w) ? p.w : 'six', goal: GS[p.goal] ? p.goal : '10k', k, t: _pj.PM.lastAbs + k, lv: Object.assign({}, PJ_LV0, p.lv) }; }
      else if (a === 'kprev') st.k = Math.max(1, st.k - 1);
      else if (a === 'knext') st.k = Math.min(PJ_KMAX, st.k + 1);
      else if (a === 'kprev12') st.k = Math.max(1, st.k - 12);
      else if (a === 'knext12') st.k = Math.min(PJ_KMAX, st.k + 12);
      else if (a === 'setk') st.k = +t.dataset.v;
      else if (a === 'reset') st.lv = Object.assign({}, PJ_LV0);
      else return;
    }
    pjSync(); pjDraw();
  });
  page.addEventListener('submit', e => {
    if (!_pj.PM || !e.target.matches('.psave')) return;
    e.preventDefault();
    const st = _pj.st, name = (pjQ('[data-name]').value || '').trim() || pjDefName();
    const same = (_pj.plans || []).find(p => p.name === name);   // same name replaces that plan, as before
    const plan = { id: same ? same.id : pjNewId(), name, w: st.w, goal: st.goal, k: st.k, t: _pj.PM.lastAbs + st.k, lv: Object.assign({}, st.lv),
                   savedAt: new Date().toISOString(), savedBy: (auth.currentUser && auth.currentUser.email) || '' };
    pjOpenSave(false);
    pjSavePlan(plan);
  });
  page.addEventListener('keydown', e => { if (e.key === 'Escape' && e.target.matches('[data-name]')) pjOpenSave(false); });
  page.addEventListener('input', e => {
    const x = e.target.dataset && e.target.dataset.l;
    if (!x || !_pj.PM) return;
    const st = _pj.st;
    if (x === 'goal') st.goal = e.target.value;
    else if (x === 'flat') st.lv.flat = e.target.checked;
    else if (x === 'rebate') { const v = Math.round(+e.target.value * 10) / 10; st.lv.rebate = v === _pj.PM.rebRate() ? null : v; }
    else st.lv[x] = +e.target.value;
    pjDraw();
  });
}

  if(!sorted.length){

    return;
  }

  if(dashSel===null || dashSel<0 || dashSel>sorted.length-1) dashSel = sorted.length-1;
  const sel = dashSel;
  const c = dashCompute(sorted, sel);
  const m = c.m, d = c.d;
  const profitable = c.isProfit;
  const rx = parseFloat(m.rxSales)||0;
  const fSign=n=>(n<0?'-$':'+$')+Math.abs(Math.round(n)).toLocaleString('en-CA');
  const fPct=n=>(n>=0?'+':'')+(n*100).toFixed(1)+'%';
  const shortM=key=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(key.split('-')[1])-1];

  // standing pill
  const near = !profitable && c.needMore!==null && c.needMore <= rx*0.30;
  const standingPill = profitable
    ? `<span class="pill teal"><span class="dot"></span>Profitable</span>`
    : near ? `<span class="pill amber"><span class="dot"></span>Near break-even</span>`
    : `<span class="pill red"><span class="dot"></span>Below break-even</span>`;

  // growth chip + strings
  const gv = c.growth;
  let chip = `<span class="k-chip flat">—</span>`, growthAvgStr='—', growthSub='First month of data', growthCls='';
  if(gv.last!==null && gv.avg!==null){

  }

  const beKpiNum = profitable ? 'Profitable' : (c.beMonths!==null ? c.beMonths+' mo.' : 'N/A');
  const beKpiSub = profitable ? 'Net profit is positive' : 'At '+fPct(c.g)+'/mo realistic growth';

    setTimeout(()=>{ charts.streams&&charts.streams.resize(); charts.perf&&charts.perf.resize(); },40);

  const ab=document.getElementById('dashAssumeBtn');

const DASH_C = { navy:'#1B3A6B', teal:'#1D9E75', amber:'#BA7517', red:'#E05252', ink:'#16243d', muted:'#5d6b85', faint:'#93a0b6', line:'#e6e8f0' };
function _wa(hex,a){ const h=hex.replace('#',''); return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`; }

function dashAnimateNum(el, from, to, fmtFn){
  if(!el) return; const dur=600, t0=performance.now(); const ease=t=>1-Math.pow(1-t,3);
  function step(now){ let p=Math.min(1,(now-t0)/dur); el.textContent=fmtFn(from+(to-from)*ease(p)); if(p<1) requestAnimationFrame(step); else el.textContent=fmtFn(to); }
  requestAnimationFrame(step);
}

function dashRatesUpTo(sorted, idx){
  const win = parseInt(settings.avgWindow)||6;
  const slice = sorted.slice(Math.max(0, idx-win+1), idx+1);
  let sumRx=0,sumGP=0,sumReb=0;
  slice.forEach(mm=>{
    const r=parseFloat(mm.rxSales)||0;
    const fm=(parseFloat(mm.rxGP_fees)||0)+(parseFloat(mm.rxGP_markup)||0);
    const gp=fm>0?fm:r*((mm.rxGP_pct!==undefined?parseFloat(mm.rxGP_pct):settings.rxGPPct)||0)/100;
    let reb=parseFloat(mm.rebate); if(!(reb>0)) reb=r*(settings.rebatePct||0)/100;
    sumRx+=r; sumGP+=gp; sumReb+=reb;
  });
  if(settings.rateBasis==='avg' && sumRx>0)
    return { rxGPRate:sumGP/sumRx, rebRate:sumReb/sumRx, source:'avg', window:slice.length };
  return { rxGPRate:(settings.rxGPPct||0)/100, rebRate:settings.rebateMethod==='pct'?(settings.rebatePct||0)/100:0, source:'manual', window:0 };
}

function dashGrowthCalc(sorted, idx){
  // Window of GROWTH_WINDOW_MONTHS ending on the selected month, i.e. N-1
  // month-over-month rates. Matches calcRollingAvgGrowth(), which feeds the
  // growthRates.realistic fallback, so both mean the same "average growth".
  const start=Math.max(1, idx-(GROWTH_WINDOW_MONTHS-2)); const rates=[];
  for(let k=start;k<=idx;k++){ const p=calcMonthData(sorted[k-1]).totalGP, cu=calcMonthData(sorted[k]).totalGP; if(p>0) rates.push((cu-p)/p); }
  const avg = rates.length? rates.reduce((s,r)=>s+r,0)/rates.length : null;
  // Compound rate over the same span — used for every forward projection.
  let cagr = null;
  if(rates.length){
    const f=calcMonthData(sorted[start-1]).totalGP, l=calcMonthData(sorted[idx]).totalGP;
    if(f>0 && l>0) cagr = Math.pow(l/f, 1/(idx-start+1)) - 1;
  }
  let last=null; if(idx>=1){ const p=calcMonthData(sorted[idx-1]).totalGP; if(p>0) last=(calcMonthData(sorted[idx]).totalGP-p)/p; }
  let trend='stable';
  if(rates.length>=2){ const mid=Math.ceil(rates.length/2); const fa=rates.slice(0,mid).reduce((s,r)=>s+r,0)/mid; const la=rates.slice(-mid).reduce((s,r)=>s+r,0)/mid; const diff=la-fa; if(diff>0.005)trend='accelerating'; else if(diff<-0.005)trend='decelerating'; }
  return { avg, cagr, last, trend };
}

function dashAddMonths(monthKey, n){
  const [y,mo]=monthKey.split('-').map(Number); const t=(mo-1)+n; const yy=y+Math.floor(t/12); const mm=((t%12)+12)%12;
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mm]+' '+yy;
}

function dashCompute(sorted, idx){
  const m = sorted[idx];
  const d = calcMonthData(m);
  // Use the SELECTED MONTH's own expenses, so every figure on this panel agrees
  // with the Net Profit shown beside it. calcTotalExpenses() is a single current
  // setting, so using it made the ring read "GP X vs Y needed" while the net was
  // computed from a different Y. Fall back to the setting only if the month has none.
  const monthExp = parseFloat(m.expenses) || 0;
  const expenses = monthExp > 0 ? monthExp : calcTotalExpenses();
  const vmRaw = parseFloat(settings.valuationMultiple);
  const vm = (isFinite(vmRaw) && vmRaw > 0) ? vmRaw : 3;
  const target = 1000000;
  const rates = dashRatesUpTo(sorted, idx);
  const combined = rates.rxGPRate + rates.rebRate;
  // The margin is only trustworthy when it was measured (avg basis) or when GP is
  // genuinely entered as a % of Rx sales. Under fee+markup with a manual basis,
  // `combined` is just settings.rxGPPct — a number the Settings page itself calls
  // "not measured". The Rx-sales targets already hide behind this; so must the ETA.
  const ratesOK = combined > 0 && (settings.rxGPMethod === 'pct' || rates.source === 'avg');
  const growth = dashGrowthCalc(sorted, idx);
  // Compound rate for projections; fall back to the simple mean, then to settings.
  const gMeasured = growth.cagr!==null || growth.avg!==null;
  const g = growth.cagr!==null ? growth.cagr
          : growth.avg!==null ? growth.avg
          : (settings.growthRates.realistic||3)/100;
  // Trailing expense growth, measured over the SAME window as g so the two
  // rates driving the moving-target loop are comparable and adding old history
  // cannot silently re-time the milestone. Deflation is preserved, not clamped to
  // zero — a pharmacy actively cutting costs should get credit for it.
  const expAnchorIdx = Math.max(0, idx - (GROWTH_WINDOW_MONTHS-1));
  const anchorExp = parseFloat(sorted[expAnchorIdx].expenses) || 0;
  const expSpan = idx - expAnchorIdx;
  const expGrowth = (expSpan > 0 && anchorExp > 0 && monthExp > 0)
    ? Math.pow(monthExp/anchorExp, 1/expSpan) - 1 : 0;

  // Valuation is based on NET profit run-rate: monthly net profit × 12 × multiple.
  // Until the pharmacy is profitable, the panel shows a break-even forecast instead.
  // Derive net from the SAME `expenses` every other figure here uses. Reading it
  // from d.netProfit instead would use m.expenses directly, which is 0 for a month
  // with a blank expense field — that made a loss-making month report a huge
  // valuation and flip the panel to the $1M model.
  const monthlyNet = d.totalGP - expenses;
  const isProfit = monthlyNet >= 0;
  const value = Math.max(0, monthlyNet) * 12 * vm;
  const pct = Math.min(100, Math.max(0, value/target*100));

  const rx = parseFloat(m.rxSales)||0;
  const targetRx = rx*(1+g);
  const frontGP = d.frontGP;

  // Months to $1M valuation (only shown once profitable). Modelled on Rx SALES,
  // which is the lever the pharmacy actually pulls:
  //   net profit needed = $1M / multiple / 12
  //   Rx sales needed   = (net needed + expenses - front-store GP) / combined margin
  //                       i.e. break-even sales PLUS the sales that fund that net
  // Rx sales are then compounded at the trailing growth rate until they reach it.
  // The target is recomputed every month because expenses keep rising — it is a
  // moving goalpost, not a fixed line.
  const reqNet1M = target/(12*vm);
  let m1=null, m1Blocked=null;   // m1Blocked explains WHY there is no date
  if(isProfit){
    if(value>=target) m1=0;
    else if(!gMeasured) m1Blocked='nodata';      // g is an assumed setting, not measured
    else if(!ratesOK)   m1Blocked='rates';       // margin isn't measured — can't price a target
    else if(!(g>0))     m1Blocked='growth';      // flat or shrinking
    else if(!(rx>0))    m1Blocked='sales';       // nothing to compound
    else {
      let rxF=rx, exF=expenses;
      for(let s3=1;s3<=120;s3++){
        rxF*=(1+g); exF*=(1+expGrowth);
        if(rxF >= (reqNet1M + exF - frontGP)/combined){ m1=s3; break; }
      }
      // Ran the full horizon without converging: costs are outrunning sales, or
      // the milestone is simply more than 10 years out. Saying "need positive
      // growth" here would be flatly wrong — growth IS positive.
      if(m1===null) m1Blocked = (expGrowth >= g) ? 'outrun' : 'faraway';
    }
  }
  const arrival1M = (m1===null||m1===0) ? null : dashAddMonths(m.monthKey, m1);
  // Switch on whether GP actually scales with Rx sales, not on the rate source.
  // Under fee+markup calcMonthData ignores rxSales entirely (rxGP is the entered
  // dollars), so re-running it with a higher targetRx returned identical output —
  // the "next month at +12%" tile was silently showing this month's GP unchanged.
  let projGP, projNet;
  if(settings.rxGPMethod === 'pct'){
    const nd = calcMonthData({...m, rxSales:targetRx});
    projGP = nd.totalGP;
  } else {
    projGP = targetRx*combined + frontGP;
  }
  projNet = projGP - expenses;

  const beRx = combined>0 ? (expenses - frontGP)/combined : null;
  const needMore = beRx!==null ? beRx-rx : null;
  // Rx sales required for a $1M valuation AT TODAY'S COSTS (the ETA above lets
  // this target drift upward as expenses grow).
  const valRx = combined>0 ? (reqNet1M + expenses - frontGP)/combined : null;
  const awayMillion = valRx!==null ? valRx-rx : null;

  // Months to break-even: grow current GP run-rate at avg growth until it covers expenses.
  let beMonths=null;
  if(monthlyNet>=0) beMonths=0;
  else if(g>0 && gMeasured){ let gp=d.totalGP, ex=expenses; for(let s2=1;s2<=120;s2++){ gp*=(1+g); ex*=(1+expGrowth); if(gp-ex>=0){ beMonths=s2; break; } } }
  // Break-even forecast detail: progress = current GP vs the GP needed to cover expenses.
  const beDate = (beMonths && beMonths>0) ? dashAddMonths(m.monthKey, beMonths) : null;
  const bePct  = expenses>0 ? Math.min(100, Math.max(0, d.totalGP/expenses*100)) : 0;
  const beGpGap = Math.max(0, expenses - d.totalGP);

  return { m, d, expenses, vm, value, pct, isProfit, monthlyNet, m1, m1Blocked, arrival1M, targetRx, projGP, projNet, beRx, needMore, valRx, awayMillion, beMonths, beDate, bePct, beGpGap, rates, combined, frontGP, g, expGrowth, growth };
}

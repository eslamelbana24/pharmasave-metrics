// Fetch the current user's permissions doc from Firestore.
// Returns the data object or null if the user is not in the system.
async function fetchUserRecord(email) {
  const doc = await db.collection(FS_USERS).doc(email).get();
  if (!doc.exists) return null;
  const data = doc.data() || {};
  // Removed staff keep a tombstone doc so the bootstrap cannot resurrect them;
  // it must still read as no access, hitting the normal "Access denied" path.
  if (data.removed === true) return null;
  data.pages = normalizePages(data.pages);
  return data;
}

// Projections replaced Forecast (Oct 2026). Stored permission docs can still
// list 'Forecast': read it as Projections, and drop names no page uses, so the
// app, the admin chips, roleLabel and a re-saved row all agree on real access.
function normalizePages(pages) {
  const p = Array.isArray(pages) ? pages.slice() : [];
  if (p.includes('Forecast') && !p.includes('Projections')) p.push('Projections');
  return p.filter(x => ALL_PAGES.includes(x));
}

// Default users that should always exist in Firestore.
// merge:true means existing page assignments are never overwritten.
// Add new permanent accounts here — they will be created automatically
// the next time the owner logs in (even if the system is already bootstrapped).
const DEFAULT_USERS = [
  { email: 'eslam.elbana@gmail.com',                pages: [...ALL_PAGES], role: 'Owner'        },
  { email: 'escarpment.pharmacy@gmail.com',          pages: [...ALL_PAGES], role: 'Full Access'  },
  { email: 'doctormetwally84@gmail.com',             pages: [...ALL_PAGES], role: 'Full Access',  authMethod: 'google' },
  { email: 'tatjana.dsouza@escarpmenthealth.ca',     pages: ['EHC'],        role: 'Clinic Staff', authMethod: 'email', mustChangePassword: true },
  { email: 'tatjana.dsouza@gmail.com',               pages: ['EHC'],        role: 'Clinic Staff', authMethod: 'google' },
  // escarpmenthealth.ca is on Microsoft 365, not Google Workspace, so a work
  // address cannot use "Sign in with Google" — clinic staff on that domain are
  // email/password. The Firebase Auth account must be created in the console
  // first; this record only grants what that account may see once it signs in.
  { email: 'vanessa.silaphet@escarpmenthealth.ca',   pages: ['EHC'],        role: 'Clinic Staff', authMethod: 'email', mustChangePassword: true },
];

// Ensures every entry in DEFAULT_USERS exists in Firestore.
// Called on every owner login — merge:true means existing records are never clobbered.
async function bootstrapUsersIfNeeded() {
  const col  = db.collection(FS_USERS);
  const opts = { merge: true };
  // One-time repair: move any revocation list the previous version left inside
  // pharmasave/settings into its own doc, then delete just that field.
  try {
    const sRef  = db.collection(FS_COL).doc(FS_SETTINGS);
    const sSnap = await sRef.get();
    const sData = sSnap.exists ? (sSnap.data() || {}) : {};
    if ('removedUsers' in sData) {
      const legacy = Array.isArray(sData.removedUsers) ? sData.removedUsers : [];
      if (legacy.length) {
        await db.collection(FS_COL).doc(FS_REVOKED)
          .set({ emails: firebase.firestore.FieldValue.arrayUnion(...legacy) }, { merge: true });
      }
      await sRef.set({ removedUsers: firebase.firestore.FieldValue.delete() }, { merge: true });
      console.log('[Bootstrap] Moved revocations out of settings:', legacy);
    }
  } catch (e) {
    console.warn('[Bootstrap] settings repair skipped:', e.code || e.message);
  }

  // Legacy tombstones: a users/ doc with removed:true still satisfies exists() in
  // the security rules, so the account kept database access. Revoke + delete.
  try {
    const all   = await col.get();
    const stale = all.docs.filter(d => ((d.data() || {}).removed === true));
    if (stale.length) {
      await db.collection(FS_COL).doc(FS_REVOKED)
        .set({ emails: firebase.firestore.FieldValue.arrayUnion(...stale.map(d => d.id)) }, { merge: true });
      await Promise.all(stale.map(d => col.doc(d.id).delete()));
      console.log('[Bootstrap] Converted tombstones to real deletions:', stale.map(d => d.id));
    }
  } catch (e) {
    console.warn('[Bootstrap] tombstone migration skipped:', e.code || e.message);
  }

  // Projections replaced Forecast (Oct 2026). Anyone who could open Forecast
  // gets Projections, so retiring the page never takes a view away. It runs
  // before anything below can return early, and the backfill re-reads after it.
  try {
    const everyone = await col.get();
    const toGrant  = everyone.docs.filter(d => {
      const pg = (d.data() || {}).pages;
      return Array.isArray(pg) && pg.includes('Forecast') && !pg.includes('Projections');
    });
    if (toGrant.length) {
      await Promise.all(toGrant.map(d => col.doc(d.id).set({ pages: [...d.data().pages, 'Projections'] }, opts)));
      console.log('[Bootstrap] Granted Projections to former Forecast users:', toGrant.map(d => d.id));
    }
  } catch (e) {
    console.warn('[Bootstrap] Projections grant skipped:', e.code || e.message);
  }

  // Read revocations fresh from Firestore — never from the in-memory settings,
  // which is still empty at this point. If it cannot be read, create nobody:
  // assuming an empty list is exactly how a removed user gets resurrected.
  const revoked = await getRevokedUsers();
  if (revoked === null) {
    console.warn('[Bootstrap] revoked list unreadable — skipping user seeding');
    return;
  }
  // Fetch all default-user docs in parallel to see which are missing
  const snapshots = await Promise.all(DEFAULT_USERS.map(u => col.doc(u.email).get()));
  const toCreate  = DEFAULT_USERS.filter((u, i) => !snapshots[i].exists && !revoked.includes(u.email));
  if (toCreate.length) {
    await Promise.all(toCreate.map(u => col.doc(u.email).set(u, opts)));
    console.log('[Bootstrap] Created missing user docs:', toCreate.map(u => u.email));
  }

  // Backfill pages for full-access roles. When a new page is added to ALL_PAGES,
  // existing permission docs still hold the old list, so those users would never
  // see it. Restricted users (e.g. clinic staff) are deliberately left alone.
  const backfills = [];
  DEFAULT_USERS.forEach((u, i) => {
    const snap = snapshots[i];
    if (!snap.exists) return;                      // just created above with full list
    const cur  = snap.data() || {};
    if (cur.removed === true) return;               // never re-widen a removed account
    // Decide from what THIS entry is defined to grant, not from the role string
    // stored in Firestore. The admin panel lets role and pages be set
    // independently, so a stale or mistaken role of 'Full Access' on a clinic
    // account would otherwise silently hand it every page on the next
    // owner login — overriding the pages the owner had actually chosen.
    const intended = DEFAULT_USERS[i];
    const grantsAll = Array.isArray(intended.pages) && ALL_PAGES.every(p => intended.pages.includes(p));
    if (!grantsAll) return;
    const have   = Array.isArray(cur.pages) ? cur.pages : [];
    const merged = [...new Set([...have, ...ALL_PAGES])];
    if (merged.length !== have.length) {
      backfills.push({ email: u.email, merged });
    }
  });
  if (backfills.length) {
    await Promise.all(backfills.map(b => col.doc(b.email).set({ pages: b.merged }, opts)));
    console.log('[Bootstrap] Backfilled pages for:', backfills.map(b => b.email));
  }
}

// Has this person set their own password since they were last flagged? Staff
// cannot clear mustChangePassword on users/ (owner-write-only), so the proof
// lives on their own loginActivity doc. It names the flag it answered rather
// than comparing timestamps: the owner's PC and a staff phone never agree on
// the time, and a re-add (new mustChangePasswordSince) must ask again.
function passwordSetSince(login, rec) {
  if (!login || typeof login.passwordSetAt !== 'string') return false;
  const since = rec && rec.mustChangePasswordSince;
  return !since || login.passwordSetFor === since;
}
async function ownPasswordSet(email, rec) {
  try {
    const snap = await Promise.race([
      db.collection(FS_LOGINS).doc(email).get(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000)),
    ]);
    return passwordSetSince(snap.exists ? snap.data() : null, rec);
  } catch (e) {
    console.warn('[Auth] could not check passwordSetAt:', e.code || e.message);
    return false;   // unknown: show the prompt, which still works
  }
}

// ── Login activity ───────────────────────────────────────────────
// Deliberately its own collection, not a field on users/. Staff can add their own
// login record but never read anyone else's and never touch a permission doc, so
// users/ stays owner-write-only.

// "Safari on iPhone" — enough to spot a sign-in from somewhere unexpected.
function describeDevice() {
  const ua = navigator.userAgent || '';
  const browser = /Edg\//.test(ua) ? 'Edge'
                : /OPR\//.test(ua) ? 'Opera'
                : /Chrome\//.test(ua) && !/Chromium/.test(ua) ? 'Chrome'
                : /Firefox\//.test(ua) ? 'Firefox'
                : /Safari\//.test(ua) ? 'Safari' : 'Browser';
  const os = /iPhone/.test(ua) ? 'iPhone'
           : /iPad/.test(ua) ? 'iPad'
           : /Android/.test(ua) ? 'Android'
           : /Mac OS X/.test(ua) ? 'Mac'
           : /Windows/.test(ua) ? 'Windows'
           : /Linux/.test(ua) ? 'Linux' : '';
  return os ? `${browser} on ${os}` : browser;
}

async function recordLogin(user) {
  if (!user || !user.email) return;
  try {
    const email = user.email;
    // Firebase's own lastSignInTime only changes on a REAL sign-in, so reloading
    // the page on a restored session must not inflate the count. Comparing
    // against the stored value is what distinguishes the two.
    const sig = (user.metadata && user.metadata.lastSignInTime) || '';
    const marker = 'loginLogged:' + email + ':' + sig;
    try { if (sessionStorage.getItem(marker)) return; } catch (e) {}

    const ref  = db.collection(FS_LOGINS).doc(email);
    const snap = await ref.get();
    const prev = snap.exists ? (snap.data() || {}) : {};
    try { sessionStorage.setItem(marker, '1'); } catch (e) {}
    if (sig && prev.lastSignInTime === sig) return;   // same sign-in, nothing new

    await ref.set({
      email,
      lastLogin:       new Date().toISOString(),
      lastSignInTime:  sig,
      accountCreated:  (user.metadata && user.metadata.creationTime) || prev.accountCreated || null,
      device:          describeDevice(),
      method:          (user.providerData || []).some(pd => pd.providerId === 'google.com') ? 'Google' : 'Email',
      loginCount:      firebase.firestore.FieldValue.increment(1),
    }, { merge: true });
  } catch (e) {
    // Never block sign-in over an analytics write; surface it for the owner only.
    console.warn('[Login] could not record login activity:', e.code || e.message);
  }
}

// "2 hours ago" / "12 Aug 2026" — and the age in days for the stale check.
function loginAgeDays(iso) {
  if (!iso) return null;
  const t = Date.parse(iso);
  if (isNaN(t)) return null;
  return (Date.now() - t) / 86400000;
}
function relTime(iso) {
  const d = loginAgeDays(iso);
  if (d === null) return 'never';
  if (d < 1/24)  return 'just now';
  if (d < 1)     { const h = Math.round(d*24); return h + (h === 1 ? ' hour ago' : ' hours ago'); }
  if (d < 30)    { const n = Math.round(d);    return n + (n === 1 ? ' day ago'  : ' days ago'); }
  return new Date(iso).toLocaleDateString('en-CA', { day:'numeric', month:'short', year:'numeric' });
}

// ── Revoked users ────────────────────────────────────────────────
// Kept in their own document on purpose. The first version stored them on the
// settings object and wrote them with saveSettings() — a FULL-DOCUMENT overwrite
// taken from memory. The bootstrap runs before loadState(), when that object is
// still {}, so it could replace pharmasave/settings with nothing but the list,
// and a later save from memory could drop the list again. arrayUnion/arrayRemove
// with merge touch only this one field and never race with the settings load.
async function getRevokedUsers() {
  try {
    const snap = await db.collection(FS_COL).doc(FS_REVOKED).get();
    const d = snap.exists ? (snap.data() || {}) : {};
    return Array.isArray(d.emails) ? d.emails : [];
  } catch (e) {
    console.warn('[Access] could not read revoked users:', e.code || e.message);
    return null;   // unknown — callers must fail closed, not assume "nobody"
  }
}
function revokeUserEmail(email) {
  return db.collection(FS_COL).doc(FS_REVOKED)
    .set({ emails: firebase.firestore.FieldValue.arrayUnion(email) }, { merge: true });
}
function unrevokeUserEmail(email) {
  return db.collection(FS_COL).doc(FS_REVOKED)
    .set({ emails: firebase.firestore.FieldValue.arrayRemove(email) }, { merge: true });
}

// ── Admin panel helpers (owner only) ─────────────────────────────

let _adminUsers = []; // cached list for the admin panel

async function loadAdminUsers() {
  const snap = await db.collection(FS_USERS).get();
  _adminUsers = snap.docs.map(d => d.data()).filter(u => u && u.removed !== true)
    .map(u => Object.assign(u, { pages: normalizePages(u.pages) }));
  // Join in login activity. Degrades quietly: if the rules do not allow reading
  // this collection yet, the panel simply shows "no sign-in recorded".
  try {
    const lsnap = await db.collection(FS_LOGINS).get();
    const byEmail = {};
    // Staff write these docs themselves, so keep only well-typed values: one
    // odd field must not throw inside the render and hide every user row.
    const str = v => (typeof v === 'string' ? v : null);
    lsnap.docs.forEach(d => {
      const v = d.data() || {};
      byEmail[d.id] = {
        lastLogin: str(v.lastLogin), lastSignInTime: str(v.lastSignInTime), accountCreated: str(v.accountCreated),
        device: str(v.device), method: str(v.method), passwordSetAt: str(v.passwordSetAt), passwordSetFor: str(v.passwordSetFor),
        loginCount: typeof v.loginCount === 'number' ? v.loginCount : 0,
      };
    });
    _adminUsers.forEach(u => { u._login = byEmail[u.email] || null; });
  } catch (e) {
    console.warn('[Login] could not read login activity:', e.code || e.message);
    _adminUsers.forEach(u => { u._login = null; });
  }
  _adminUsers.sort((a,b) => a.email.localeCompare(b.email));
  renderAdminUserList();
}

// Describe access from the pages actually granted. The stored role is just a
// label chosen at creation time and drifts out of step the moment pages are
// edited — showing it verbatim let a row read "Full Access" beside a single page.
function roleLabel(u) {
  const p = Array.isArray(u.pages) ? u.pages : [];
  if (u.email === OWNER_EMAIL) return 'Owner';
  if (!p.length) return 'No access';
  if (ALL_PAGES.every(x => p.includes(x))) return 'Full Access';
  if (p.length === 1) return p[0] + ' only';
  return p.length + ' of ' + ALL_PAGES.length + ' pages';
}

// CSS.escape is not in older Safari; the emails here are plain attribute values.
function cssEscape(v) { return String(v).replace(/["\\]/g, '\\$&'); }

// One line of sign-in activity per user, with a stale flag after 30 days.
const STALE_LOGIN_DAYS = 30;
function loginLine(u) {
  const L = u._login;
  if (!L || !L.lastLogin) {
    return `<div style="font-size:0.75rem;color:var(--light);margin-top:3px">
              <span style="color:var(--amber);font-weight:700">Never signed in</span></div>`;
  }
  const age   = loginAgeDays(L.lastLogin);
  const stale = age !== null && age >= STALE_LOGIN_DAYS;
  const count = Number(L.loginCount) || 0;
  const bits  = [`Last seen <strong style="color:var(--text)">${relTime(L.lastLogin)}</strong>`];
  if (count)          bits.push(`${count.toLocaleString('en-CA')} login${count === 1 ? '' : 's'}`);
  if (L.device)       bits.push(esc(L.device));
  if (L.accountCreated) {
    const c = new Date(L.accountCreated);
    if (!isNaN(c)) bits.push(`since ${c.toLocaleDateString('en-CA',{month:'short',year:'numeric'})}`);
  }
  return `<div style="font-size:0.75rem;color:var(--light);margin-top:3px">
            ${bits.join(' · ')}
            ${stale ? `<span style="background:#fff8e6;color:var(--amber);font-weight:700;padding:1px 7px;border-radius:8px;margin-left:6px">Inactive ${Math.round(age)}d</span>` : ''}
          </div>`;
}

// Whether an email user has chosen their own password yet.
function passwordBadge(u) {
  if (u.authMethod !== 'email') return '';
  const pill = (bg, fg, text, title) =>
    `<span${title ? ` title="${esc(title)}"` : ''} style="font-size:10px;font-weight:600;background:${bg};color:${fg};padding:1px 7px;border-radius:8px;margin-left:6px">${text}</span>`;
  if (passwordSetSince(u._login, u)) {
    const d = new Date(u._login.passwordSetAt);
    return pill('#f0fdf4', '#15803d', 'Own password set', isNaN(d) ? '' : 'Set ' + d.toLocaleString('en-CA'));
  }
  if (u.mustChangePassword) return pill('#fff8e6', 'var(--amber)', 'Awaiting password setup', 'Has not chosen their own password in the app yet');
  return '';
}

function renderAdminUserList() {
  const el = document.getElementById('adminUserList');
  if (!el) return;
  if (!_adminUsers.length) {
    el.innerHTML = '<p class="text-sm text-light">No users found.</p>';
    return;
  }
  el.innerHTML = _adminUsers.map(u => {
    const pageChips = ALL_PAGES.map(pg => {
      const has = u.pages.includes(pg);
      return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;margin:2px;background:${has?'var(--navy)':'#e5e7eb'};color:${has?'#fff':'var(--light)'}">${pg}</span>`;
    }).join('');
    const isOwner    = u.email === OWNER_EMAIL;
    const isEmail    = u.authMethod === 'email';
    const methodBadge = isEmail
      ? `<span style="font-size:10px;font-weight:600;background:#e0f2fe;color:#0369a1;padding:1px 7px;border-radius:8px;margin-left:6px">Email</span>`
      : `<span style="font-size:10px;font-weight:600;background:#f0fdf4;color:#15803d;padding:1px 7px;border-radius:8px;margin-left:6px">Google</span>`;
    return `
      <div data-user-row="${esc(u.email)}" style="border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px">
          <div>
            <div style="font-weight:700;font-size:0.9rem;color:var(--navy)">${u.email}${methodBadge}${passwordBadge(u)}</div>
            <div style="font-size:0.75rem;color:var(--light);margin-top:2px">${roleLabel(u)}</div>
            ${loginLine(u)}
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${isEmail ? `<button class="btn btn-ghost" style="font-size:0.75rem;padding:4px 10px" onclick="sendResetEmail('${u.email}')">Send Reset Email</button>` : ''}
            <button class="btn btn-ghost" style="font-size:0.75rem;padding:4px 10px" onclick="openEditUser('${u.email}')">Edit</button>
            ${isOwner ? '' : `<button class="btn btn-danger" style="font-size:0.75rem;padding:4px 10px" onclick="removeUser('${u.email}')">Remove</button>`}
          </div>
        </div>
        <div>${pageChips}</div>
      </div>`;
  }).join('');
}

function openEditUser(email) {
  const u = _adminUsers.find(x => x.email === email);
  if (!u) return;
  const el = document.getElementById('adminUserList');
  // Replace the user's row with an inline edit form
  const existing = el.querySelectorAll('[data-edit-email]');
  existing.forEach(e => e.remove()); // close any open edit
  const checkboxes = ALL_PAGES.map(pg => `
    <label style="display:flex;align-items:center;gap:6px;font-size:0.85rem;cursor:pointer;padding:4px 0">
      <input type="checkbox" value="${pg}" ${u.pages.includes(pg)?'checked':''}
        ${u.email===OWNER_EMAIL && pg==='Settings' ? 'disabled checked' : ''}>
      ${pg}
    </label>`).join('');
  const form = document.createElement('div');
  form.setAttribute('data-edit-email', email);
  form.style.cssText = 'border:2px solid var(--navy);border-radius:10px;padding:16px;margin-bottom:10px';
  form.innerHTML = `
    <div style="font-weight:700;font-size:0.88rem;color:var(--navy);margin-bottom:12px">Edit access — ${email}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:14px">${checkboxes}</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="font-size:0.8rem" onclick="saveEditUser('${email}')">Save</button>
      <button class="btn btn-ghost"   style="font-size:0.8rem" onclick="loadAdminUsers()">Cancel</button>
    </div>`;
  // Put the form where the user clicked. It used to be inserted at the top of
  // the list regardless, so clicking Edit on anyone below the fold scrolled
  // nothing into view and simply looked broken.
  const row = el.querySelector(`[data-user-row="${cssEscape(email)}"]`);
  if (row && row.parentNode) row.parentNode.insertBefore(form, row.nextSibling);
  else el.insertBefore(form, el.firstChild);
  form.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

async function saveEditUser(email) {
  const form = document.querySelector(`[data-edit-email="${email}"]`);
  if (!form) return;
  const checked = [...form.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
  if (!checked.length) { alert('User must have at least one page.'); return; }
  try {
    await db.collection(FS_USERS).doc(email).update({ pages: checked });
  } catch (e) {
    // Previously an unhandled rejection: the write failed and the form just sat
    // there, so a rules denial was indistinguishable from the button not working.
    alert('Could not save access for ' + email + ':\n' + (e.code || e.message));
    return;
  }
  await loadAdminUsers();
}

async function removeUser(email) {
  if (email === OWNER_EMAIL) return;
  if (!confirm(`Remove ${email}?\n\nThey will lose access immediately on next page load.`)) return;
  // Record the revocation FIRST, then hard-delete.
  //
  // A tombstone doc was the previous approach — it stopped the bootstrap from
  // re-seeding the account, but the Firestore rules grant pharmasave reads on
  // exists(users/{email}), which a tombstone still satisfies. A "removed" user
  // therefore kept full database access even after the app locked them out.
  // Deleting for real makes exists() false; the settings list is what stops the
  // bootstrap bringing them back.
  try {
    await revokeUserEmail(email);                      // record first, so a failed
    await db.collection(FS_USERS).doc(email).delete(); // delete cannot resurrect
  } catch (e) {
    alert('Could not remove ' + email + ': ' + (e.code || e.message));
  }
  await loadAdminUsers();
}

function openAddUserForm() {
  const el = document.getElementById('addUserForm');
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function sendResetEmail(email) {
  try {
    await sendPasswordReset(email);
    alert(`✓ Password reset email sent to ${email}\n\nIt comes from ${RESET_SENDER}. Ask them to check Junk and Quarantine if it doesn't arrive within a few minutes, and to use the newest link.`);
  } catch (err) {
    alert('Could not send reset email: ' + (err.message || err.code));
  }
}

async function saveNewUser() {
  const emailEl      = document.getElementById('newUserEmail');
  const roleEl       = document.getElementById('newUserRole');
  const authMethodEl = document.getElementById('newUserAuthMethod');
  const email      = (emailEl.value || '').trim().toLowerCase();
  const role       = roleEl ? roleEl.value : 'Custom';
  const authMethod = authMethodEl ? authMethodEl.value : 'google';
  if (!email || !email.includes('@')) { alert('Enter a valid email address.'); return; }
  if (_adminUsers.find(u => u.email === email)) { alert('This user already exists.'); return; }
  const checked = [...document.querySelectorAll('#newUserPageChecks input:checked')].map(c => c.value);
  if (!checked.length) { alert('Select at least one page.'); return; }
  const doc = { email, pages: checked, role, authMethod };
  if (authMethod === 'email') { doc.mustChangePassword = true; doc.mustChangePasswordSince = new Date().toISOString(); }
  await db.collection(FS_USERS).doc(email).set(doc);
  // Deliberately re-adding someone lifts the revocation that blocks re-seeding.
  try { await unrevokeUserEmail(email); } catch (e) { console.warn('[Access] could not lift revocation:', e.code || e.message); }
  // Offer to send welcome/reset email for email-type users
  if (authMethod === 'email') {
    if (confirm(`User saved. Send a password setup email to ${email} now?\n\n(The Firebase Auth account must already be created in Firebase Console first.)`)) {
      await sendResetEmail(email);
    }
  }
  emailEl.value = '';
  document.querySelectorAll('#newUserPageChecks input').forEach(c => c.checked = false);
  document.getElementById('addUserForm').style.display = 'none';
  await loadAdminUsers();
}

// ================================================================
// INIT (auth-gated)
// ================================================================
document.addEventListener('DOMContentLoaded', () => {
  // Show gate immediately; auth listener will hide it once signed in
  document.getElementById('authGate').style.display = 'flex';

  // Handle the result of signInWithRedirect (fires after Google sends user back)
  auth.getRedirectResult().then(result => {
    if (result && result.user) {
      console.log('[Auth] Redirect sign-in complete:', result.user.email);
      // onAuthStateChanged will fire and handle the rest
    }
  }).catch(err => {
    if (err && err.code !== 'auth/no-current-user') {
      document.getElementById('authError').textContent = 'Google sign-in failed: ' + err.message;
    }
  });

  // Helper: race a promise against a timeout
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
    ]);
  }

  function setLoadMsg(msg) {
    const el = document.getElementById('authLoadingMsg');
    if (el) el.textContent = msg;
  }

  const handleUser = async (user, gen) => {
    if (!user) {
      userRecord = null;
      document.getElementById('mainNav').innerHTML            = '';
      document.getElementById('authGate').style.display      = 'flex';
      document.getElementById('signInBtn').style.display     = 'flex';
      document.getElementById('authLoading').style.display   = 'none';
      document.getElementById('signOutBtn').style.display    = 'none';
      document.getElementById('userDisplay').textContent     = '';
      document.getElementById('authError').textContent       = '';
      document.getElementById('authError').style.color       = '#fca5a5'; // reset to red
      document.getElementById('pwChangeOverlay').style.display = 'none';
      return;
    }

    document.getElementById('authGate').style.display      = 'flex';
    document.getElementById('authLoading').style.display   = 'flex';
    document.getElementById('signInBtn').style.display     = 'none';
    document.getElementById('authError').textContent       = '';
    document.getElementById('authError').style.color       = '#fca5a5';
    setLoadMsg('Checking access…');
    console.log('[Auth v4] Signed in as:', user.email);
    recordLogin(user);   // fire-and-forget; never gates the app

    try {
      // ── TRUSTED EMAILS: never block on Firestore ─────────────────
      if (TRUSTED_EMAILS.includes(user.email)) {
        const role = user.email === OWNER_EMAIL ? 'Owner' : 'Full Access';
        console.log('[Auth] Trusted email — full access granted, role:', role);
        userRecord = { email: user.email, pages: [...ALL_PAGES], role };

        // Owner: always write their own user doc before loadState runs.
        // This is idempotent (merge:true) and guarantees the doc exists
        // so Firestore rules can pass the exists() check on pharmasave reads.
        // Background-seed other default users after the doc is confirmed.
        if (user.email === OWNER_EMAIL) {
          setLoadMsg('Setting up access…');
          try {
            await withTimeout(
              db.collection(FS_USERS).doc(OWNER_EMAIL).set(
                { email: OWNER_EMAIL, pages: [...ALL_PAGES], role: 'Owner' },
                { merge: true }
              ), 6000
            );
            console.log('[Auth] Owner doc written');
            // Seed other default users in background (non-blocking)
            bootstrapUsersIfNeeded().catch(e => console.warn('[Bootstrap]', e.message));
          } catch (bErr) {
            console.warn('[Auth] Owner doc write failed/timed out:', bErr.message);
            // Continue — if old permissive rules are in place, loadState may still work
          }
        }

        // Load app data
        setLoadMsg('Loading data…');
        console.log('[Auth] Calling loadState()…');
        try {
          await withTimeout(loadState(), 8000);
          console.log('[Auth] loadState() succeeded');
        } catch (fsErr) {
          console.error('[Auth] loadState() failed:', fsErr.message, fsErr.code);
          // Show the real error instead of silently using defaults
          document.getElementById('authError').textContent =
            'Data load failed: ' + (fsErr.code || fsErr.message) +
            ' — check browser console for details.';
          document.getElementById('signInBtn').style.display   = 'flex';
          document.getElementById('authLoading').style.display = 'none';
          return;
        }

      // ── NON-OWNER: must exist in users/ collection ────────────────
      } else {
        setLoadMsg('Checking permissions…');
        console.log('[Auth] Fetching user record…');
        let rec = null;
        try {
          rec = await withTimeout(fetchUserRecord(user.email), 8000);
        } catch (e) {
          console.error('[Auth] fetchUserRecord failed:', e.code, e.message);
          throw new Error(e.code === 'permission-denied'
            ? 'Signed in as ' + user.email + ', but the database refused access. Contact the pharmacy owner.'
            : 'Could not reach the permissions database (' + (e.code || e.message) + '). Check your connection and try again.');
        }

        if (!rec) {
          await auth.signOut();
          document.getElementById('authError').textContent     = 'Access denied. Contact the pharmacy owner to request access.';
          document.getElementById('signInBtn').style.display   = 'flex';
          document.getElementById('authLoading').style.display = 'none';
          return;
        }
        userRecord = rec;
        console.log('[Auth] User record loaded:', rec.role, rec.pages);

        setLoadMsg('Loading data…');
        await withTimeout(loadState(), 8000);
        console.log('[Auth] loadState() succeeded');
      }

    } catch (err) {
      console.error('[Auth] Fatal error:', err);
      document.getElementById('authError').textContent     = 'Error: ' + err.message;
      document.getElementById('signInBtn').style.display   = 'flex';
      document.getElementById('authLoading').style.display = 'none';
      return;
    }

    // ── Show the app ──────────────────────────────────────────────
    document.getElementById('userDisplay').textContent  = user.displayName || user.email;
    document.getElementById('signOutBtn').style.display = 'block';
    renderNav();
    document.getElementById('authGate').style.display = 'none';
    const firstPage = landingPage();
    navigate(firstPage);
    console.log('[Auth] App ready. Page:', firstPage);

    // Prompt email/password users to change their temporary password
    const isEmailUser = user.providerData.some(p => p.providerId === 'password');
    const needsPw = isEmailUser && userRecord.mustChangePassword && !(await ownPasswordSet(user.email, userRecord));
    // The app is already showing during that read, so they may have signed out
    // (or someone else signed in) meanwhile. Only the current run may show it.
    if (needsPw && gen === _authGen && auth.currentUser && auth.currentUser.uid === user.uid) {
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwCurrent').style.display = 'none';
      document.getElementById('pwNew').value     = '';
      document.getElementById('pwConfirm').value = '';
      document.getElementById('pwChangeError').textContent = '';
      document.getElementById('pwChangeOverlay').style.display = 'flex';
    }
  };
  _authHandler = async user => {
    const gen = ++_authGen;
    if (!user) { _authRunning = false; return handleUser(null, gen); }
    _authRunning = true;
    try { await handleUser(user, gen); }
    finally { if (gen === _authGen) _authRunning = false; }
  };
  auth.onAuthStateChanged(_authHandler);
});
</script>

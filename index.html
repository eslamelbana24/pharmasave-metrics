  });
}

// ================================================================
// PAGE: INSIGHTS — auto-computed analysis of monthly data
// ================================================================

// Ordinary least squares fit for y = a + b*x. Returns null when x has no variance.
function insOLS(xs, ys) {
  const n = xs.length;
  if (n < 3) return null;
  const mx = xs.reduce((s,v)=>s+v,0)/n, my = ys.reduce((s,v)=>s+v,0)/n;
  const sxx = xs.reduce((s,x)=>s+(x-mx)*(x-mx),0);
  if (sxx <= 0) return null;
  const sxy = xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0);
  const b = sxy/sxx, a = my - b*mx;
  const sst = ys.reduce((s,y)=>s+(y-my)*(y-my),0);
  const ssr = ys.reduce((s,y,i)=>s+Math.pow(y-(a+b*xs[i]),2),0);
  return { a, b, r2: sst > 0 ? 1 - ssr/sst : 0 };
}

function renderInsights() {
  const el = document.getElementById('page-insights');
  // Destroy before any early return so a stale chart never survives a re-render
  destroyChart('insPerScript');

  // De-duplicate by monthKey (last write wins) so a duplicate entry can't
  // become its own "previous month" and zero out the comparison card.
  const byKey = new Map();
  [...months].sort((a,b) => a.monthKey.localeCompare(b.monthKey)).forEach(m => byKey.set(m.monthKey, m));
  const sorted = [...byKey.values()];

  if (sorted.length < 2) {
    el.innerHTML = `<div class="card" style="text-align:center;padding:48px 20px;color:var(--light)">
      Insights need at least 2 months of data. Add months in <strong>Monthly Data</strong>.</div>`;
    return;
  }

  const iSign = n => (Math.round(n) === 0 ? '$0' : (n < 0 ? '-$' : '+$') + Math.abs(Math.round(n)).toLocaleString('en-CA'));
  const iPct  = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
  const per   = n => '$' + n.toFixed(2);

  // Per-month derived metrics
  const M = sorted.map(m => {
    const d   = calcMonthData(m);
    const cnt = Number(m.rxCount) || 0;
    const rx  = parseFloat(m.rxSales) || 0;
    return {
      key: m.monthKey, label: monthKeyToLabel(m.monthKey), rx, cnt,
      dispGP: d.rxGP + d.frontGP,
      rxGP: d.rxGP, frontGP: d.frontGP, rebate: d.rebate,
      gp: d.totalGP, exp: d.totalExp, net: d.netProfit,
      cogs: rx - d.rxGP,                                   // drug acquisition cost
      perRx:     cnt > 0 ? rx / cnt : null,                // revenue per script
      rxGpPerRx: cnt > 0 ? d.rxGP / cnt : null,            // dispensing GP per script (same Rx basis)
      gpPerRx:   cnt > 0 ? d.totalGP / cnt : null,         // total GP per script (incl. rebate + front)
      margin:    rx > 0 ? d.rxGP / rx * 100 : null,
    };
  });

  const last = M[M.length - 1], prev = M[M.length - 2], first = M[0];

  // Distinguish "no expense data" from "zero expenses" — otherwise a blank
  // expense field makes every profitability signal report success.
  const hasExp = last.exp > 0;
  const gap = hasExp ? Math.max(0, last.exp - last.gp) : null;

  // ── MoM decomposition ─────────────────────────────────────────
  const dDisp = last.dispGP - prev.dispGP;
  const dReb  = last.rebate - prev.rebate;
  const dExp  = -(last.exp - prev.exp);   // sign flipped: higher expenses hurt net
  const dNet  = last.net - prev.net;

  // ── Marginal economics ────────────────────────────────────────
  // Blended GP/script overstates what ONE more script earns: front-store GP is a
  // fixed block, and operating expenses themselves scale with volume. Fit both
  // lines against script count and use the contribution margin instead.
  const fitRows = M.filter(x => x.cnt > 0);
  const fitX    = fitRows.map(x => x.cnt);
  const gpFit   = fitRows.length >= 4 ? insOLS(fitX, fitRows.map(x => x.gp))  : null;
  const expFit  = fitRows.length >= 4 ? insOLS(fitX, fitRows.map(x => x.exp)) : null;

  let contribPerScript = null, breakEvenScripts = null, marginalBasis = null;
  if (gpFit && expFit && gpFit.r2 >= 0.5) {
    const c  = gpFit.b - expFit.b;
    const be = (expFit.a - gpFit.a) / c;
    if (c > 0 && isFinite(be) && be > 0 && be < 1e6) {
      contribPerScript = c; breakEvenScripts = be; marginalBasis = 'contribution';
    }
  }
  if (contribPerScript === null && last.rxGpPerRx > 0) {
    contribPerScript = last.rxGpPerRx; marginalBasis = 'dispensing';
  }

  let scriptsNeeded = null;
  if (gap !== null && gap > 0) {
    if (marginalBasis === 'contribution' && last.cnt > 0) {
      scriptsNeeded = Math.max(0, Math.ceil(breakEvenScripts - last.cnt));
    } else if (contribPerScript > 0) {
      scriptsNeeded = Math.ceil(gap / contribPerScript);
    }
  }
  const scriptsSub = gap === null ? `add expenses for ${last.label}`
    : gap === 0 ? 'GP covers expenses'
    : scriptsNeeded === null ? (last.cnt > 0 ? 'GP per script is not positive' : 'needs Rx Count data')
    : marginalBasis === 'contribution'
      ? `more scripts/mo · ${per(contribPerScript)} contribution each (${per(gpFit.b)} GP − ${per(expFit.b)} cost)`
      : `more scripts/mo at ${per(contribPerScript)} dispensing GP each`;

  // ── Growth pace + break-even ETA (expenses are NOT held fixed) ─
  const gStart = Math.max(1, M.length - (GROWTH_WINDOW_MONTHS-1));
  const gpGrowths = [];
  for (let i = gStart; i < M.length; i++) {
    if (M[i-1].gp > 0) gpGrowths.push(M[i].gp / M[i-1].gp - 1);
  }
  // Compound, not the mean of percentages — averaging rates then compounding them
  // overstates growth (+100% then -50% averages to +25% but nets to 0%).
  const gSpan = M.length - gStart;
  const g3 = (gpGrowths.length && M[gStart-1].gp > 0 && last.gp > 0)
    ? Math.pow(last.gp / M[gStart-1].gp, 1/gSpan) - 1
    : (gpGrowths.length ? gpGrowths.reduce((s,v)=>s+v,0)/gpGrowths.length : 0);
  // Expense drift over the SAME window as the growth rate above, so the two rates
  // driving this projection are comparable — and so adding older history cannot
  // silently re-time the estimate. Deflation is preserved, not clamped to zero.
  const eAnchor = M[gStart-1];
  const expGrowth = (gSpan > 0 && eAnchor && eAnchor.exp > 0 && last.exp > 0)
    ? Math.pow(last.exp / eAnchor.exp, 1/gSpan) - 1 : 0;

  let beEta = null, remainingBurn = null;
  if (hasExp) {
    if (last.net >= 0) beEta = 0;
    else if (g3 > 0) {
      let gp = last.gp, ex = last.exp, tot = 0;
      for (let i = 1; i <= 60; i++) {
        gp *= (1 + g3); ex *= (1 + expGrowth);
        const n = gp - ex;
        if (n >= 0) { beEta = i; break; }
        tot += n;
      }
      if (beEta !== null) remainingBurn = tot;
    }
  }
  const beEtaLabel = !hasExp ? '—' : beEta === 0 ? 'Profitable ✓' : beEta !== null ? beEta + ' mo' : '—';
  const beEtaDate  = (beEta && beEta > 0) ? (() => {
    const [y,mo] = last.key.split('-').map(Number);
    return new Date(y, mo-1+beEta, 1).toLocaleString('en-CA',{month:'short',year:'numeric'});
  })() : null;
  const beEtaSub = !hasExp ? `add expenses for ${last.label}`
    : beEta === 0 ? 'net profit is positive'
    : beEtaDate ? `≈ ${beEtaDate} · GP ${iPct(g3*100)}/mo vs expenses ${iPct(expGrowth*100)}/mo`
    : 'needs positive GP growth';

  // ── Cash: burned to date + projected remaining ────────────────
  const cumNet = M.reduce((s,x) => s + x.net, 0);

  // ── Average Rx value (gross Rx sales ÷ prescriptions) ─────────
  const avgRxDelta = (last.perRx !== null && prev.perRx !== null) ? last.perRx - prev.perRx : null;

  // ── Script growth, rebate rate, expense creep ─────────────────
  const scriptMoM = (prev.cnt > 0 && last.cnt > 0) ? (last.cnt / prev.cnt - 1) * 100 : null;
  const rebRows = M.filter(x => x.rebate > 0 && x.cogs > 0).slice(-3);
  const rebRate = rebRows.length >= 2
    ? rebRows.reduce((s,x)=>s+x.rebate,0) / rebRows.reduce((s,x)=>s+x.cogs,0) * 100 : null;
  const expCreep = first.exp > 0 && hasExp ? (last.exp / first.exp - 1) * 100 : 0;

  // ── Auto-generated insight bullets ────────────────────────────
  const bullets = [];
  if (!hasExp) {
    bullets.push({icon:'⚠️', text:`No expenses recorded for ${last.label}, so profitability, break-even and cash figures are unavailable. Add them in <strong>Monthly Data</strong>.`});
  } else if (dNet >= 0) {
    bullets.push({icon:'📈', text:`Net improved ${iSign(dNet)} in ${last.label} vs ${prev.label}.`});
  } else if (dDisp > 0) {
    const causes = [];
    if (dExp < 0) causes.push(`higher expenses (${iSign(dExp)})`);
    if (dReb < 0) causes.push(`a weaker rebate (${iSign(dReb)})`);
    bullets.push({icon:'⚠️', text:`Net slipped ${iSign(dNet)} in ${last.label} — but the core dispensing business gained ${iSign(dDisp)}${causes.length ? '. The regression came from ' + causes.join(' and ') : ''}.`});
  } else {
    bullets.push({icon:'🔻', text:`Net declined ${iSign(dNet)} in ${last.label}, including a drop in core dispensing GP (${iSign(dDisp)}).`});
  }

  // The entire gap expressed per prescription — usually the most actionable framing
  if (gap !== null && gap > 0 && last.cnt > 0) {
    const shortfall = gap / last.cnt;
    bullets.push({icon:'🎯', text:`Your entire ${fmt(gap)} gap is <strong>${per(shortfall)} per prescription</strong>. At ${last.cnt.toLocaleString('en-CA')} scripts/month, capturing ${per(shortfall)} more dispensing GP per script closes it with no new patients.`});
  }

  // Drug purchases — typically the largest cash line, and invisible elsewhere
  if (last.cogs > 0 && hasExp) {
    const share  = last.cogs / (last.cogs + last.exp) * 100;
    const onePct = last.cogs * 0.01;
    const gapNote = (gap !== null && gap > 0) ? ` — ${(onePct/gap*100).toFixed(0)}% of the gap` : '';
    bullets.push({icon:'📦', text:`Drug purchases ran ${fmt(last.cogs)} in ${last.label} — ${share.toFixed(0)}% of all cash out and ${(last.cogs/last.exp).toFixed(2)}× your operating expenses. A 1% better acquisition cost is worth ${fmt(onePct)}/mo${gapNote}.`});
  }

  if (scriptMoM !== null) {
    if (scriptMoM < 0) {
      bullets.push({icon:'🔻', text:`Scripts fell ${iPct(scriptMoM)} (${prev.cnt.toLocaleString('en-CA')} → ${last.cnt.toLocaleString('en-CA')}) — the first thing to fix.`});
    } else if (scriptMoM < 5) {
      bullets.push({icon:'🐌', text:`Script growth nearly stalled: ${iPct(scriptMoM)} (${prev.cnt.toLocaleString('en-CA')} → ${last.cnt.toLocaleString('en-CA')}). Scripts are what your transfers & blister-pack work drives — watch next month.`});
    } else {
      bullets.push({icon:'💪', text:`Scripts grew ${iPct(scriptMoM)} (${prev.cnt.toLocaleString('en-CA')} → ${last.cnt.toLocaleString('en-CA')}).`});
    }
  }

  // Rebate framed as a purchase discount, not a lottery
  if (rebRate !== null) {
    bullets.push({icon:'💊', text:`Rebates are running at ${rebRate.toFixed(1)}% of drug purchases over the last ${rebRows.length} months — a purchase discount that scales with buying, not a windfall. Month-to-month swings are mostly payment timing.`});
  }

  // Margin compared to its own distribution rather than one cherry-picked month
  const margins = M.map(x => x.margin).filter(v => v !== null);
  if (margins.length >= 4 && last.margin !== null) {
    const mMean = margins.reduce((s,v)=>s+v,0)/margins.length;
    const mSd   = Math.sqrt(margins.reduce((s,v)=>s+Math.pow(v-mMean,2),0)/margins.length);
    const dev   = last.margin - mMean;
    const isPct = settings.rxGPMethod !== 'fee_markup';
    if (isPct) {
      bullets.push({icon:'ℹ️', text:`Rx margin shows ${last.margin.toFixed(1)}%, but GP method is set to <strong>% of Rx Sales</strong> — this is your setting, not a measured margin. Switch to Fee + Markup to track real margin.`});
    } else if (mSd > 0 && Math.abs(dev) > mSd) {
      bullets.push({icon: dev > 0 ? '🧪' : '⚠️', text:`Rx margin ${last.margin.toFixed(1)}% is ${dev > 0 ? 'above' : 'below'} its ${mMean.toFixed(1)}% average by more than one standard deviation (±${mSd.toFixed(1)}) — a genuine move, not noise.`});
    } else {
      bullets.push({icon:'📊', text:`Rx margin is ${last.margin.toFixed(1)}%, in line with its ${mMean.toFixed(1)}% ± ${mSd.toFixed(1)} average — no real trend either way.`});
    }
  }

  if (expCreep > 5) {
    let clause = '';
    if (gap !== null && gap > 0 && g3 > 0 && hasExp && beEta) {
      const moPer1k = 1000 / (last.exp * Math.log(1 + g3));
      if (isFinite(moPer1k) && moPer1k > 0) {
        clause = ` At the current GP pace each $1k of creep delays break-even about ${moPer1k.toFixed(1)} month${moPer1k >= 1.05 ? 's' : ''}.`;
      }
    }
    bullets.push({icon:'💸', text:`Expenses have crept ${iPct(expCreep)} since ${first.label} (${fmt(first.exp)} → ${fmt(last.exp)}).${clause}`});
  }

  if (gap === 0 && hasExp) bullets.push({icon:'🎉', text:`${last.label} was profitable — gross profit covered all expenses.`});

  const bulletHtml = bullets.map(b => `
    <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border)">
      <span style="flex:none">${b.icon}</span>
      <span style="font-size:.9rem;line-height:1.55;color:var(--text)">${b.text}</span>
    </div>`).join('');

  const decompRow = (lbl, val, note) => `
    <div class="gp-row" style="padding:7px 0">
      <span>${lbl}${note ? ` <span class="text-xs text-light">${note}</span>` : ''}</span>
      <span style="font-weight:700" class="${Math.round(val) === 0 ? '' : val > 0 ? 'pos' : 'neg'}">${iSign(val)}</span>
    </div>`;

  const trendRows = [...M].reverse().map(x => `
    <tr>
      <td style="font-weight:600">${x.label}</td>
      <td>${fmt(x.rx)}</td>
      <td>${x.cogs > 0 ? fmt(x.cogs) : '—'}</td>
      <td>${x.cnt ? x.cnt.toLocaleString('en-CA') : '—'}</td>
      <td>${x.perRx !== null ? per(x.perRx) : '—'}</td>
      <td>${x.rxGpPerRx !== null ? per(x.rxGpPerRx) : '—'}</td>
      <td>${x.margin !== null ? x.margin.toFixed(1) + '%' : '—'}</td>
      <td class="${x.net >= 0 ? 'pos' : 'neg'}">${fmt(x.net)}</td>
    </tr>`).join('');

  // Break-even tiles only have something to say while the pharmacy is still
  // losing money. Once gross profit covers expenses they drop off the strip.
  // gap === null means expenses simply aren't recorded yet — that's a data gap,
  // not success, so the tiles stay visible (and prompt for the missing input).
  const beTiles = gap === 0 ? '' : `
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Scripts to Break Even</div>
        <div class="kpi-val-wrap"><div class="kpi-value" style="${gap === null ? '' : 'color:var(--amber)'}">${gap === null ? '—' : (scriptsNeeded !== null ? '+' + scriptsNeeded.toLocaleString('en-CA') : '—')}</div></div>
        <div class="kpi-sub">${scriptsSub}</div>
      </div>
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Break-even ETA</div>
        <div class="kpi-val-wrap"><div class="kpi-value">${beEtaLabel}</div></div>
        <div class="kpi-sub">${beEtaSub}</div>
      </div>
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Cash to Break Even</div>
        <div class="kpi-val-wrap"><div class="kpi-value" style="color:${remainingBurn === null ? 'var(--navy)' : 'var(--red)'}">${remainingBurn !== null ? fmt(remainingBurn) : '—'}</div></div>
        <div class="kpi-sub">${remainingBurn !== null ? `more to burn · ${fmt(cumNet)} cumulative to date` : `${fmt(cumNet)} cumulative net to date`}</div>
      </div>`;

  el.innerHTML = `
    <div class="kpi-grid mb-20" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Avg Rx Value</div>
        <div class="kpi-val-wrap"><div class="kpi-value">${last.perRx !== null ? per(last.perRx) : '—'}</div></div>
        <div class="kpi-sub">${last.perRx === null ? 'add Rx Count in Monthly Data'
          : avgRxDelta === null ? `${last.label} · Rx sales ÷ prescriptions`
          : `${last.label} · ${(avgRxDelta >= 0 ? '+' : '−') + per(Math.abs(avgRxDelta))} vs ${prev.label}`}</div>
      </div>
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Dispensing GP / Script</div>
        <div class="kpi-val-wrap"><div class="kpi-value">${last.rxGpPerRx !== null ? per(last.rxGpPerRx) : '—'}</div></div>
        <div class="kpi-sub">${last.rxGpPerRx === null ? 'add Rx Count in Monthly Data' : `${last.label} · ${per(last.gpPerRx)} incl. rebate &amp; front store`}</div>
      </div>
      ${beTiles}
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Drug Purchases</div>
        <div class="kpi-val-wrap"><div class="kpi-value">${last.cogs > 0 ? fmt(last.cogs) : '—'}</div></div>
        <div class="kpi-sub">${last.cogs > 0 && hasExp ? `${(last.cogs/(last.cogs+last.exp)*100).toFixed(0)}% of cash out · ${(last.cogs/last.exp).toFixed(2)}× expenses` : 'Rx sales minus dispensing GP'}</div>
      </div>
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Rx Margin</div>
        <div class="kpi-val-wrap"><div class="kpi-value">${last.margin !== null ? last.margin.toFixed(1) + '%' : '—'}</div></div>
        <div class="kpi-sub">${settings.rxGPMethod === 'fee_markup' ? 'fee + markup as % of Rx sales' : 'from your % of Rx Sales setting — not measured'}</div>
      </div>
      <div class="kpi-card kpi-std">
        <div class="kpi-label">Expense Creep</div>
        <div class="kpi-val-wrap"><div class="kpi-value" style="color:${expCreep > 5 ? 'var(--amber)' : 'var(--navy)'}">${hasExp ? iPct(expCreep) : '—'}</div></div>
        <div class="kpi-sub">${hasExp ? `since ${first.label} (${fmt(first.exp)} → ${fmt(last.exp)})` : `add expenses for ${last.label}`}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px" class="weekly-pb-grid">
      <div class="card">
        <div class="card-title">What Changed — ${last.label} vs ${prev.label}</div>
        <div class="gp-summary" style="margin-top:0">
          ${decompRow('Core dispensing GP', dDisp, '(fee + markup + front store)')}
          ${decompRow('Rebate', dReb, '')}
          ${decompRow('Expenses', dExp, '(negative = costs went up)')}
          <div class="gp-divider"></div>
          <div class="gp-row gp-total"><span>Net change</span><span class="${Math.round(dNet) === 0 ? '' : dNet > 0 ? 'pos' : 'neg'}">${iSign(dNet)}</span></div>
        </div>
        ${dNet < 0 && dDisp > 0 ? `<div style="font-size:.82rem;color:var(--light);margin-top:10px;font-style:italic">The core business improved — the net slip came from the items above it.</div>` : ''}
      </div>
      <div class="card">
        <div class="card-title">Auto Insights</div>
        ${bulletHtml || '<div class="text-sm text-light">Nothing notable this month.</div>'}
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Per-Script Economics</div>
      <div class="chart-wrap" style="height:260px"><canvas id="insPerScriptChart"></canvas></div>
      <div style="font-size:.72rem;color:var(--light);margin-top:8px">Revenue and dispensing GP share the same Rx basis, so the gap between them is drug cost per script. Total GP per script (dashed) adds rebate and front-store GP, which do not scale one-for-one with prescriptions.</div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div class="card-title" style="padding:18px 18px 0">Monthly Detail</div>
      <div class="tbl-wrap">
        <table class="data-tbl">
          <thead><tr><th>Month</th><th>Rx Sales</th><th>Drug Cost</th><th>Scripts</th><th>$ / Script</th><th>Disp GP / Script</th><th>Rx Margin</th><th>Net Profit</th></tr></thead>
          <tbody>${trendRows}</tbody>
        </table>
      </div>
    </div>`;

  renderInsightsChart(M);
}

function renderInsightsChart(M) {
  destroyChart('insPerScript');
  const canvas = document.getElementById('insPerScriptChart');
  if (!canvas) return;
  charts.insPerScript = new Chart(canvas, {
    type: 'line',
    data: {
      labels: M.map(x => x.label),
      datasets: [
        { label:'Revenue per script', data: M.map(x => x.perRx), borderColor:'#1B3A6B', backgroundColor:'rgba(27,58,107,.08)',
          borderWidth:2.5, pointRadius:4, fill:true, tension:.3, spanGaps:false },
        { label:'Dispensing GP per script', data: M.map(x => x.rxGpPerRx), borderColor:'#1D9E75', backgroundColor:'rgba(29,158,117,.10)',
          borderWidth:2.5, pointRadius:4, fill:true, tension:.3, spanGaps:false },
        { label:'Total GP per script (incl. rebate + front)', data: M.map(x => x.gpPerRx), borderColor:'#BA7517',
          borderWidth:2, borderDash:[5,4], pointRadius:3, fill:false, tension:.3, spanGaps:false },
      ],
    },
    options: {
      responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'top', labels:{boxWidth:12, font:{size:11}}},
        tooltip:{callbacks:{label:ctx => ctx.parsed.y === null || ctx.parsed.y === undefined
          ? ` ${ctx.dataset.label}: no Rx count`
          : ` ${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}`}},
      },
      scales:{
        x:{grid:{display:false}},
        y:{beginAtZero:true, ticks:{callback:v => '$' + v}},
      },
    },
  });
}

function renderMonthly() {
  const el = document.getElementById('page-monthly');

  // Build MoM growth map keyed by monthKey.
  // Requires chronological order to compare consecutive months.
  const chron = [...months].sort((a,b) => a.monthKey.localeCompare(b.monthKey));
  const momMap = {};  // monthKey -> growth % | null
  chron.forEach((m, i) => {
    if (i === 0) { momMap[m.monthKey] = null; return; }
    const prevGP = calcMonthData(chron[i-1]).totalGP;
    const currGP = calcMonthData(m).totalGP;
    momMap[m.monthKey] = prevGP > 0
      ? parseFloat(((currGP - prevGP) / prevGP * 100).toFixed(1))
      : null;
  });

  function momCell(pct) {
    if (pct === null) return `<td style="color:var(--light)">—</td>`;
    if (pct > 0)  return `<td class="pos">↑ ${pct.toFixed(1)}%</td>`;
    if (pct < 0)  return `<td class="neg">↓ ${Math.abs(pct).toFixed(1)}%</td>`;
    return `<td style="color:var(--light)">→ 0.0%</td>`;
  }

  // Display order: newest first
  const sorted = [...months].sort((a,b) => b.monthKey.localeCompare(a.monthKey));

  const rows = sorted.map(m => {
    const d = calcMonthData(m);
    return `
      <tr>
        <td><strong>${monthKeyToLabel(m.monthKey)}</strong></td>
        <td>${fmt(m.rxSales)}</td>
        <td>${Number(m.rxCount) ? Number(m.rxCount).toLocaleString('en-CA') : '—'}</td>
        <td>${fmt(m.frontSales)}</td>
        <td>${fmt(m.rebate)}</td>
        <td>${fmt(d.totalGP)}</td>
        ${momCell(momMap[m.monthKey])}
        <td>${fmt(d.totalExp)}</td>
        <td class="${d.netProfit>=0?'pos':'neg'}">${fmt(d.netProfit)}</td>
        <td>
          <div class="flex gap-8">
            <button class="btn btn-ghost btn-xs" onclick="openEditModal('${esc(m.id)}')">Edit</button>
            <button class="btn btn-danger btn-xs" onclick="deleteMonth('${esc(m.id)}')">Delete</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  // Totals
  const tot = months.reduce((acc, m) => {
    const d = calcMonthData(m);
    return {gp: acc.gp + d.totalGP, exp: acc.exp + d.totalExp, np: acc.np + d.netProfit};
  }, {gp:0, exp:0, np:0});

  // Average MoM growth across all months that have a prior month to compare
  const momValues = Object.values(momMap).filter(v => v !== null);
  const momAvg = momValues.length
    ? parseFloat((momValues.reduce((s,v)=>s+v,0) / momValues.length).toFixed(1))
    : null;
  const momAvgCell = momAvg === null
    ? `<td style="color:var(--light)">—</td>`
    : `<td style="color:${momAvg>=0?'var(--teal)':'var(--red)'}"><strong>Avg: ${momAvg>=0?'+':''}${momAvg.toFixed(1)}%</strong></td>`;

  el.innerHTML = `
    <div class="flex justify-between items-center wrap gap-8 mb-16">
      <div class="text-sm text-light">${months.length} month${months.length!==1?'s':''} entered</div>
      <div class="flex gap-8">
        <button class="btn btn-success btn-sm" onclick="downloadCSV()">⬇ CSV</button>
        <button class="btn btn-primary" onclick="openAddModal()">+ Add Month</button>
      </div>
    </div>

    ${!months.length ? '<div class="alert alert-warning">No months added yet. Click <strong>+ Add Month</strong> to get started.</div>' : ''}

    ${months.length ? `
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tbl-wrap">
        <table class="data-tbl">
          <thead><tr>
            <th>Month</th><th>Rx Sales</th><th>Rx Count</th><th>Front Store</th><th>Rebate</th>
            <th>Total GP</th><th>MoM Growth</th><th>Expenses</th><th>Net Profit</th><th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="tot-row">
            <td colspan="5"><strong>TOTALS (${months.length} months)</strong></td>
            <td><strong>${fmt(tot.gp)}</strong></td>
            ${momAvgCell}
            <td><strong>${fmt(tot.exp)}</strong></td>
            <td class="${tot.np>=0?'pos':'neg'}"><strong>${fmt(tot.np)}</strong></td>
            <td></td>
          </tr></tfoot>
        </table>
      </div>
    </div>` : ''}`;
}

function deleteMonth(id) {
  if (!confirm('Delete this month? This cannot be undone.')) return;
  months = months.filter(m => m.id !== id);
  saveMonths();
  syncRealisticRate();
  renderMonthly();
  updateBadge();
}

function downloadCSV() {
  const sorted = [...months].sort((a,b) => a.monthKey.localeCompare(b.monthKey));
  const headers = ['Month','Rx Sales','Rx Count','Front Store Sales','Rebate','Total GP','Expenses','Net Profit'];
  const rows = sorted.map(m => {
    const d = calcMonthData(m);
    return [monthKeyToLabel(m.monthKey), m.rxSales, (m.rxCount||0), m.frontSales, m.rebate, d.totalGP.toFixed(2), d.totalExp.toFixed(2), d.netProfit.toFixed(2)];
  });
  const csv = [headers,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'pharmasave-monthly.csv';
  a.click();
}

function renderExpenses() {
  const el = document.getElementById('page-expenses');
  const isLump = settings.expenseMethod === 'lump';
  const total  = calcTotalExpenses();

  el.innerHTML = `
    <div class="card">
      <div class="card-title">Expense Entry Method</div>
      <div class="pill-toggle mb-16">
        <button class="pill-opt ${isLump?'active':''}" onclick="setExpMethod('lump')">Lump Sum</button>
        <button class="pill-opt ${!isLump?'active':''}" onclick="setExpMethod('itemized')">Itemized Breakdown</button>
      </div>

      ${isLump ? `
        <div class="form-row">
          <label>Total Monthly Expenses ($)</label>
          <div class="input-prefix"><span>$</span>
            <input type="text" id="lumpInput" class="dollar-input" value="${(settings.lumpExpenses||0).toLocaleString('en-CA')}"
              oninput="onLumpInput(this.value)">
          </div>
          <div class="hint">This amount is used for all months as the default expense figure.</div>
        </div>
        <div class="gp-summary" style="margin-top:16px">
          <div class="gp-row"><span>Total Monthly Expenses</span><strong>${fmt(total)}</strong></div>
        </div>
      ` : `
        <div id="expAlertArea"></div>
        <div class="tbl-wrap mb-12">
          <table class="exp-tbl" id="expTable">
            <thead><tr><th>Expense Name</th><th>Monthly Amount ($)</th><th></th></tr></thead>
            <tbody id="expRows"></tbody>
            <tfoot><tr class="foot">
              <td><strong>Total Monthly Expenses</strong></td>
              <td><strong id="expTotal" style="color:var(--navy)">${fmt(total)}</strong></td>
              <td></td>
            </tr></tfoot>
          </table>
        </div>
        <div class="flex gap-8 wrap">
          <button class="btn btn-primary btn-sm" onclick="addExpLine()">+ Add Expense</button>
          <button class="btn btn-success btn-sm" onclick="saveExpenses()">Save Expenses</button>
        </div>
      `}
    </div>`;

  if (!isLump) renderExpRows();
  setupDollarInputs(el);
}

function setExpMethod(method) {
  settings.expenseMethod = method;
  saveSettings();
  renderExpenses();
}

function onLumpInput(val) {
  settings.lumpExpenses = parseDollar(val);
  saveSettings();
}

function renderExpRows() {
  const tbody = document.getElementById('expRows');
  if (!tbody) return;
  tbody.innerHTML = (settings.itemizedExpenses||[]).map((e,i) => `
    <tr>
      <td><input type="text" value="${esc(e.name)}" oninput="updExpLine(${i},'name',this.value)" placeholder="Expense name"></td>
      <td><input type="text" class="dollar-input" value="${(e.amount||0).toLocaleString('en-CA')}" oninput="updExpLine(${i},'amount',this.value)" placeholder="0"></td>
      <td><button class="btn btn-danger btn-xs" onclick="delExpLine(${i})">Delete</button></td>
    </tr>`).join('');
  setupDollarInputs(document.getElementById('expTable'));
}

function updExpLine(i, field, val) {

// Transfer source management
function addTransferSource() {
  if (!settings.transferSources) settings.transferSources = [];
  settings.transferSources.push('New Source');
  saveSettings();
  renderSettings();
}
function renameTransferSource(i, name) {
  if (!settings.transferSources) return;
  settings.transferSources[i] = name;
  saveSettings();
}
function deleteTransferSource(i) {
  if (!settings.transferSources) return;
  const name = settings.transferSources[i];

  settings.transferSources.splice(i, 1);

// ================================================================
// EXPORT / IMPORT / RESET
// ================================================================
function exportData() {
  const payload = {version:2, exportedAt: new Date().toISOString(), settings, months, weeklyEntries, weeklyTargets};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}));
  a.download = 'pharmasave-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.months || !data.settings) throw new Error('Invalid backup file');
        if (!confirm(`Import ${data.months.length} months of data? This will replace all current data.`)) return;
        settings      = mergeDeep(DEFAULT_SETTINGS, data.settings);
        months        = data.months;
        weeklyEntries = data.weeklyEntries || [];
        weeklyTargets = data.weeklyTargets || [];
        saveSettings(); saveMonths(); saveWeeklyEntries(); saveWeeklyTargets();
        navigate(currentPage);
        alert('Import successful!');
      } catch(e) {
        alert('Import failed: ' + e.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

async function resetData() {
  if (!confirm('Reset ALL data? This will delete all monthly entries and restore default settings. This cannot be undone.')) return;
  await Promise.all([
    db.collection(FS_COL).doc(FS_SETTINGS).delete(),
    db.collection(FS_COL).doc(FS_MONTHS).delete(),
    db.collection(FS_COL).doc(FS_WEEKLY_DATA).delete(),
    db.collection(FS_COL).doc(FS_WEEKLY_TARGETS).delete(),
  ]);
  await loadState();
  navigate(currentPage);
  alert('All data has been reset to defaults.');
}

function openAddModal() {
  const defaultExp = calcTotalExpenses();
  // Pre-fill rebate from % if that method is selected
  const lastRx = months.length ? months[months.length-1].rxSales : 0;
  const defaultRebate = settings.rebateMethod === 'pct'
    ? Math.round(lastRx * settings.rebatePct / 100)
    : 0;

  const m = {
    id: uid(),
    monthKey: currentMonthKey(),
    rxSales:      0,
    rxGP_fees:    0,
    rxGP_markup:  0,
    rxGP_pct:     settings.rxGPPct,
    frontSales:   0,
    frontGP_pct:  settings.frontGPPct,
    frontGP_actual: 0,
    rebate:       defaultRebate,
    expenses:     defaultExp,
    _isNew:       true,
  };
  showModal(m);
}

  const m = months.find(x => x.id === id);

// Collect current modal field values into a month-like object for live preview
function collectModal() {
  const get = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  return {
    id:            get('mMonth') || currentMonthKey(),
    monthKey:      get('mMonth') || currentMonthKey(),
    rxSales:       parseDollar(get('mRxSales')),
    rxCount:       parseInt(get('mRxCount')) || 0,
    rxGP_fees:     parseDollar(get('mRxFees')),
    rxGP_markup:   parseDollar(get('mRxMarkup')),
    rxGP_pct:      parseFloat(get('mRxPct'))  || settings.rxGPPct,
    frontSales:    parseDollar(get('mFrontSales')),
    frontGP_pct:   parseFloat(get('mFrontPct'))    || settings.frontGPPct,
    frontGP_actual: parseDollar(get('mFrontActual')),
    rebate:        parseDollar(get('mRebate')),
    expenses:      parseDollar(get('mExpenses')),
    _isNew:        true,
  };
}

function modalUpdate() {
  // When rebate method is %, auto-fill the rebate field from current Rx Sales
  if (settings.rebateMethod === 'pct') {
    const rxSalesEl = document.getElementById('mRxSales');
    const rebateEl  = document.getElementById('mRebate');
    if (rxSalesEl && rebateEl) {
      const rxSales = parseDollar(rxSalesEl.value);
      const computed = rxSales * settings.rebatePct / 100;
      rebateEl.value = numFmt(computed);
    }
  }
  const m = collectModal();
  const d = calcMonthData(m);
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
  set('mRxGP',    fmt(d.rxGP));
  set('mFrontGP', fmt(d.frontGP));
  set('sumRxGP',    fmt(d.rxGP));
  set('sumFrontGP', fmt(d.frontGP));
  set('sumRebate',  fmt(d.rebate));
  set('sumTotalGP', fmt(d.totalGP));
  set('sumExp',     fmt(d.totalExp));
  set('sumNP',      fmt(d.netProfit));
  const npEl = document.getElementById('sumNP');
  if (npEl) npEl.className = d.netProfit >= 0 ? 'pos' : 'neg';
}

function saveModal(id, isNew) {
  const m = collectModal();
  const monthKey = document.getElementById('mMonth')?.value || currentMonthKey();
  if (!monthKey) { alert('Please select a month.'); return; }

  const record = {
    id:             isNew ? uid() : id,
    monthKey,
    rxSales:        m.rxSales,
    rxCount:        m.rxCount,
    rxGP_fees:      m.rxGP_fees,
    rxGP_markup:    m.rxGP_markup,
    rxGP_pct:       m.rxGP_pct,
    frontSales:     m.frontSales,
    frontGP_pct:    m.frontGP_pct,
    frontGP_actual: m.frontGP_actual,
    rebate:         m.rebate,
    expenses:       m.expenses,
  };

  if (isNew) {
    // Check for duplicate month
    if (months.find(x => x.monthKey === monthKey)) {
      if (!confirm(`A record for ${monthKeyToFull(monthKey)} already exists. Replace it?`)) return;
      months = months.filter(x => x.monthKey !== monthKey);
    }
    months.push(record);
  } else {
    const idx = months.findIndex(x => x.id === id);
    if (idx >= 0) months[idx] = record;
  }

  saveMonths();
  syncRealisticRate();
  closeModal();
  navigate('monthly');
  updateBadge();
}

// DOLLAR INPUT HELPERS
// ================================================================
function numFmt(n) {
  const v = parseFloat(n) || 0;
  return v ? Math.round(v).toLocaleString('en-CA') : '';
}

function setupDollarInputs(container) {
  if (!container) return;
  container.querySelectorAll('input.dollar-input').forEach(inp => {
    inp.addEventListener('blur', function() {
      const v = parseDollar(this.value);
      this.value = v ? Math.round(v).toLocaleString('en-CA') : '';
    });
    inp.addEventListener('focus', function() {
      const v = parseDollar(this.value);
      this.value = v ? String(Math.round(v)) : '';
    });
  });
}

  db.collection(FS_COL).doc(FS_WEEKLY_TARGETS).set({ targets: weeklyTargets }).catch(console.error);

// Maps a weekly metric to its settings key
const WEEKLY_TARGET_KEYS = {
  transfers:    'transfersWeeklyTarget',
  blisterPacks: 'blisterPacksWeeklyTarget',
  rxCount:      'rxWeeklyTarget',
  feeMarkup:    'feeMarkupWeeklyTarget',
};

// Called from Settings when a target input changes
function updateWeeklyTarget(metric, value) {
  // Update live setting for immediate UI use
  const key = WEEKLY_TARGET_KEYS[metric] || 'rxWeeklyTarget';
  settings[key] = value;
  saveSettings();

  // Record the change with today's date so historical charts stay accurate
  const today = new Date().toISOString().slice(0, 10);
  const idx = weeklyTargets.findIndex(t => t.metric === metric && t.effectiveFrom === today);
  if (idx >= 0) weeklyTargets[idx].value = value;
  else weeklyTargets.push({ metric, value, effectiveFrom: today });
  saveWeeklyTargets();
}

// Look up what target was active for a given week
function getTargetForWeek(metric, weekStart) {
  const key = WEEKLY_TARGET_KEYS[metric] || 'rxWeeklyTarget';
  const history = weeklyTargets
    .filter(t => t.metric === metric && t.effectiveFrom <= weekStart)
    .sort((a, b) => b.effectiveFrom.localeCompare(a.effectiveFrom));
  return history.length ? history[0].value : (settings[key] || 0);
}

// ================================================================
// WEEKLY METRICS — DATE UTILITIES
// ================================================================
function getMondayISO(dateInput) {
  const d = new Date(typeof dateInput === 'string' ? dateInput + 'T12:00:00' : dateInput);
  const day = d.getDay();                  // 0=Sun
  const diff = day === 0 ? -6 : 1 - day;  // shift to Monday
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}
function getCurrentMondayISO() { return getMondayISO(new Date()); }

function weekLabel(weekStart) {
  const d   = new Date(weekStart + 'T12:00:00');
  const sun = new Date(d);
  sun.setDate(d.getDate() + 6);
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getMonth() === sun.getMonth()
    ? `${mo[d.getMonth()]} ${d.getDate()}–${sun.getDate()}`
    : `${mo[d.getMonth()]} ${d.getDate()}–${mo[sun.getMonth()]} ${sun.getDate()}`;
}

// ================================================================
// WEEKLY METRICS — AGGREGATION
// ================================================================
function weeksInMonth(year, month) {
  return weeklyEntries.filter(w => {
    const d = new Date(w.weekStart + 'T12:00:00');
    return d.getFullYear() === year && (d.getMonth() + 1) === month;
  });
}
function monthlyTotal(metric, year, month) {
  return weeksInMonth(year, month).reduce((s, w) => s + (Number(w[metric]) || 0), 0);
}
function allTimeBP() {
  return weeklyEntries.reduce((s, w) => s + (Number(w.blisterPacks) || 0), 0);
}

function impliedBPWeeklyTarget() {
  const current  = allTimeBP();
  const absolute = settings.bpAbsoluteTarget || 0;
  const needed   = Math.max(0, absolute - current);
  let weeks = 26;
  if (settings.bpGoalMethod === 'weeks') {
    weeks = Math.max(1, parseFloat(settings.bpGoalWeeks) || 26);
  } else if (settings.bpGoalDate) {
    const ms = new Date(settings.bpGoalDate) - new Date();
    weeks = Math.max(1, Math.ceil(ms / (7 * 864e5)));
  }
  return needed > 0 ? Math.ceil(needed / weeks) : 0;
}

  '🤝 Transfers are your highest-leverage metric — one patient can bring their whole family.',

function getWeeklyTip() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const atBP    = allTimeBP();
  const bpGoal  = settings.bpAbsoluteTarget || 0;
  const bpLeft  = Math.max(0, bpGoal - atBP);
  const mTrans  = monthlyTotal('transfers', y, m);
  const wTT     = settings.transfersWeeklyTarget || 0;
  const mTGoal  = Math.round(wTT * 4.33);

  if (bpGoal > 0 && bpLeft > 0 && bpLeft <= 10)
    return `🎯 Only ${bpLeft} more blister packs to hit your ${bpGoal}-pack all-time goal!`;
  if (bpGoal > 0 && atBP >= bpGoal)
    return `🎉 You've hit your all-time blister pack goal of ${bpGoal}! Time to set a new one.`;
  if (wTT > 0 && mTrans > 0 && mTrans < mTGoal)
    return `📈 ${mTrans} transfers this month — only ${mTGoal - mTrans} away from your monthly target of ${mTGoal}.`;

  return WEEKLY_TIPS[Math.floor(now.getDate() / 4) % WEEKLY_TIPS.length];
}

// ================================================================
// EHC HERO + MONTHLY PACE STRIP
// ================================================================
// Implements the "EHC Hero Redesign" from Claude Design. The pace strip is
// shared: EHC embeds it inside the hero card, Weekly Metrics renders it alone,
// so both pages always agree on what monthly progress means.
const MRING_METRICS = [
  { key:'transfers',    name:'Transfers',     targetKey:'transfersWeeklyTarget',    color:'#5B9BF5' },
  { key:'blisterPacks', name:'Blister packs', targetKey:'blisterPacksWeeklyTarget', color:'#F5A623' },
  { key:'rxCount',      name:'Rx count',      targetKey:'rxWeeklyTarget',           color:'#22C08A' },
];
const EPACE_RED = '#E05252', EPACE_GREEN = '#22C08A';

// The three monthly metrics, each as a small ring plus its numbers.
function renderPaceStrip(solo) {
  const now  = new Date();
  const y    = now.getFullYear(), m = now.getMonth() + 1;
  const dim  = new Date(y, m, 0).getDate();
  const pace = Math.min(1, now.getDate() / dim);       // fraction of month elapsed
  const logged = weeksInMonth(y, m).length;            // nothing logged is not the same as behind
  const R = 31, SW = 8, C = 2 * Math.PI * R;

  const cards = MRING_METRICS.map(mm => {
    const actual = monthlyTotal(mm.key, y, m);
    const weekly = parseFloat(settings[mm.targetKey]) || 0;
    const target = Math.round(weekly * 4.33);
    const fmtN   = n => Math.round(n).toLocaleString('en-CA');

    let pctLabel, offset, colour, status, statusColour, nums;
    if (target <= 0) {
      pctLabel = '—'; offset = C; colour = 'rgba(255,255,255,.25)';
      status = 'Set a target in Settings'; statusColour = 'rgba(255,255,255,.5)';
      nums = `${fmtN(actual)}`;
    } else {
      const pct      = actual / target * 100;
      const expected = target * pace;
      // arc never inverts on a negative month and never laps past full
      offset   = C * (1 - Math.max(0, Math.min(100, pct)) / 100);
      // The design shows 0% on a negative month rather than a negative
      // percentage; the 'Net loss this month' status carries the real story.
      pctLabel = Math.max(0, Math.round(pct)) + '%';
      nums     = `${fmtN(actual)} <span>/ ${fmtN(target)}</span>`;
      colour   = actual < 0 ? EPACE_RED : mm.color;
      if (logged === 0)      { status = 'Not logged yet';       statusColour = 'rgba(255,255,255,.5)'; }
      else if (actual < 0)   { status = 'Net loss this month';  statusColour = EPACE_RED; }
      else if (pct >= 100)   { status = '✓ Target hit';         statusColour = EPACE_GREEN; }
      else if (actual >= expected) { status = 'On pace';        statusColour = EPACE_GREEN; }
      else                   { status = fmtN(expected - actual) + ' behind pace'; statusColour = EPACE_RED; }
    }

    return `
      <div class="emetric">
        <div class="emring">
          <svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="${esc(mm.name)}: ${pctLabel} of the monthly target">
            <circle cx="38" cy="38" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="${SW}"></circle>
            <circle class="emring-arc" cx="38" cy="38" r="${R}" fill="none" stroke="${colour}" stroke-width="${SW}"
                    stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"
                    data-mring-offset="${offset.toFixed(1)}"></circle>
          </svg>
          <div class="v">${pctLabel}</div>
        </div>
        <div>
          <p class="k">${esc(mm.name)}</p>
          <div class="n">${nums}</div>
          <div class="s" style="color:${statusColour}">${status}</div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="epace${solo ? ' epace-solo' : ''}">
      <div class="epace-head">
        <div class="t">${now.toLocaleString('en-CA',{month:'long'})} pace</div>
        <div class="r">Day ${now.getDate()} of ${dim} · ${Math.round(pace*100)}% through the month</div>
      </div>
      <div class="epace-grid">${cards}</div>
    </div>`;
}

// Weekly Metrics renders the pace strip on its own.
function renderMetricRings() { return renderPaceStrip(true); }

// EHC: goal ring + mission copy, with the pace strip beneath it in one card.
function renderEhcHero(codeRed, daysLeft) {
  const atBP  = allTimeBP();
  const bpAbs = parseFloat(settings.bpAbsoluteTarget) || 0;
  const toGo  = Math.max(0, bpAbs - atBP);
  const pct   = bpAbs > 0 ? Math.min(100, Math.max(0, atBP / bpAbs * 100)) : 0;
  const R = 146, SW = 22, C = 2 * Math.PI * R;
  const n = v => Math.round(v).toLocaleString('en-CA');

  let big, cap, sub, lede;
  if (bpAbs <= 0) {
    big = '—'; cap = 'no goal set';
    sub = `${n(atBP)} blister packs so far`;
    lede = 'Set a blister pack goal in Settings and this ring tracks the mission.';
  } else if (toGo === 0) {
    big = '✓'; cap = 'goal reached';
    sub  = `${n(atBP)} of ${n(bpAbs)} blister packs`;
    lede = `Goal reached — <b>${n(atBP)}</b> blister pack patients enrolled.`;
  } else {
    big = n(toGo); cap = toGo === 1 ? 'patient to go' : 'patients to go';
    sub  = `${n(atBP)} of ${n(bpAbs)} blister packs`;
    lede = `<b>${n(toGo)}</b> more blister pack patient${toGo === 1 ? '' : 's'} keeps our doors open. Every referral moves the ring.`;
  }

  const daysChip = daysLeft === null ? 'Set mission date in Settings'
                 : daysLeft <= 0     ? 'Mission complete'
                 : `${n(daysLeft)} day${daysLeft === 1 ? '' : 's'} remaining`;

  return `
    <div class="ehero${codeRed ? ' code-red' : ''}">
      <div class="ehero-top">
        <div class="ehero-ring">
          <svg viewBox="0 0 340 340" role="img" aria-label="${bpAbs > 0 ? n(atBP)+' of '+n(bpAbs)+' blister packs' : 'no blister pack goal set'}">
            <circle cx="170" cy="170" r="${R}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="${SW}"></circle>
            <circle class="ehero-arc" cx="170" cy="170" r="${R}" fill="none" stroke="#F5A623" stroke-width="${SW}"
                    stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"
                    data-mring-offset="${(C * (1 - pct/100)).toFixed(1)}"></circle>
          </svg>
          <div class="center">
            <div class="big">${big}</div>
            <div class="cap">${cap}</div>
            <div class="sub">${sub}</div>
          </div>
        </div>
        <div>
          <p class="ehero-eyebrow">The mission</p>
          <h1 class="ehero-h1">${esc((settings.ehcHeadline || '').trim() || DEFAULT_SETTINGS.ehcHeadline)}</h1>
          <p class="ehero-lede">${lede}</p>
          <div class="ehero-meta">
            <span class="ehero-chip"><span class="dot"></span>${daysChip}</span>
            ${bpAbs > 0 ? `<span>${pct.toFixed(0)}% of the way there</span>` : ''}
          </div>
        </div>
      </div>
      ${renderPaceStrip(false)}
    </div>`;
}

function renderWeekly() {

  const sorted = [...weeklyEntries].sort((a, b) => a.weekStart.localeCompare(b.weekStart));
  const last12 = sorted.slice(-12);
  const now    = new Date();

  // Targets
  const wTT  = settings.transfersWeeklyTarget    || 0;
  const wBPT = settings.blisterPacksWeeklyTarget  || 0;
  const wRxT = settings.rxWeeklyTarget            || 0;
  const mTT  = Math.round(wTT  * 4.33);
  const mBPT = Math.round(wBPT * 4.33);

  // Actuals
  const mT   = monthlyTotal('transfers',    y, m);
  const mBP  = monthlyTotal('blisterPacks', y, m);
  const atBP = allTimeBP();

  // Progress pcts
  function pct(val, tgt) { return tgt > 0 ? Math.min(100, (val / tgt) * 100) : 0; }
  const tPct  = pct(mT,   mTT);
  const bPct  = pct(mBP,  mBPT);
  const atPct = pct(atBP, bpAbs);

  function progBar(pcnt, color) {
    return `<div class="wk-prog-bar"><div class="wk-prog-fill" style="width:${pcnt.toFixed(1)}%;background:${color}"></div></div>`;
  }

  el.innerHTML = `
    <div class="wk-tip">${getWeeklyTip()}</div>
    ${renderMetricRings()}

    <!-- Rolling avg summary cards -->
    ${(() => {
      const last13 = sorted.slice(-13);

      function rollingAvg(metric) {
        if (!last13.length) return null;
        return last13.reduce((s, w) => s + (Number(w[metric]) || 0), 0) / last13.length;
      }

      function avgCard(title, avg, target) {

            <div class="card-title" style="margin-bottom:12px">${title}</div>
            <div style="color:var(--light);font-size:.84rem">Not enough data yet</div>

        const indColor = onTarget === null ? 'var(--light)'
                       : onTarget        ? 'var(--teal)'
                       :                   'var(--red)';
        const indLabel = onTarget === null ? '—'
                       : onTarget        ? '✓ At or above target'
                       :                   '↓ Below target';

        return `
          <div class="card" style="padding:18px 20px">
            <div class="card-title" style="margin-bottom:14px">${title}</div>
            <div style="font-size:.7rem;color:var(--light);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">3-Month Rolling Avg</div>
            <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:14px">

      const tAvg  = rollingAvg('transfers');
      const bpAvg = rollingAvg('blisterPacks');
      const tTgt  = settings.transfersWeeklyTarget    || 0;
      const bpTgt = settings.blisterPacksWeeklyTarget  || 0;

      return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px" class="weekly-pb-grid">

    })()}

    <!-- Charts -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-bottom:16px">
      <div class="card" style="padding:16px 18px">
        <div class="card-title">Transfers — Last 12 Weeks</div>
        <div class="chart-wrap" style="height:200px"><canvas id="wkChartTransfers"></canvas></div>
      </div>
      <div class="card" style="padding:16px 18px">
        <div class="card-title">Blister Packs — Last 12 Weeks</div>
        <div class="chart-wrap" style="height:200px"><canvas id="wkChartBP"></canvas></div>
      </div>

        <div class="card-title">Rx Count — Last 12 Weeks</div>

      <div class="card-title">Fee + Markup — Last 12 Weeks</div>
      <div class="chart-wrap" style="height:220px"><canvas id="wkChartFM"></canvas></div>
    </div>

    <!-- Transfer Source Insight -->
    <div class="card" style="padding:16px 18px;margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="card-title" style="margin:0">Transfer Sources — Last 12 Weeks</div>
        <button id="srcChartToggleBtn" onclick="toggleSourceChartView()"
          style="font-size:.72rem;padding:4px 12px;background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--navy);font-weight:600">
          ${_srcChartView === 'stacked' ? 'Trend' : 'Stacked'}
        </button>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="wkChartSrc"></canvas></div>

    <!-- Weekly log table -->
    ${sorted.length ? `
    <div class="card">
      <div class="card-title">Weekly Log</div>
      <div class="tbl-wrap">
        <table class="data-tbl">
          <thead><tr>
            <th>Week</th>

            <th>Rx Count</th>
            <th>Fee + Markup</th>
            <th style="width:100px"></th>
          </tr></thead>
          <tbody>
            ${[...sorted].reverse().map(w => {
              const tT  = getTargetForWeek('transfers',    w.weekStart);
              const bT  = getTargetForWeek('blisterPacks', w.weekStart);
              const rT  = getTargetForWeek('rxCount',      w.weekStart);
              const hit = (v, t) => t > 0 && v >= t ? '<span class="wk-hit">✓</span>' : '';
              const bpVal = w.blisterPacks < 0

              return `<tr>

    </div>
    ` : `<div class="card" style="text-align:center;padding:48px 20px;color:var(--light)">

  // Render all charts after DOM is written

function toggleSourceChartView() {
  _srcChartView = _srcChartView === 'stacked' ? 'trend' : 'stacked';
  const sorted = [...weeklyEntries].sort((a, b) => a.weekStart.localeCompare(b.weekStart));
  destroyChart('wk_srcInsight');
  renderSourceChart('wkChartSrc', sorted.slice(-12));
  const btn = document.getElementById('srcChartToggleBtn');
  if (btn) btn.textContent = _srcChartView === 'stacked' ? 'Trend' : 'Stacked';
}

function renderSourceChart(canvasId, weeks) {
  destroyChart('wk_srcInsight');
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const srcs      = settings.transferSources || [];
  const wkLabels  = weeks.map(w => weekLabel(w.weekStart));

  // Per-source data arrays
  const sourceDatasets = srcs.map((src, i) => ({
    label: src,
    color: SOURCE_PALETTE[i % SOURCE_PALETTE.length],
    data:  weeks.map(w => (w.sources ? (Number(w.sources[src]) || 0) : 0)),
  }));

  // "Untagged" for backward-compat entries that only have a total (no sources object)
  const untaggedData = weeks.map(w => (!w.sources || !Object.keys(w.sources).length) ? (Number(w.transfers) || 0) : 0);
  const hasUntagged  = untaggedData.some(v => v > 0);

  const commonOpts = {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { position: 'bottom', labels: { font:{size:10}, boxWidth:12, padding:10 } },
      tooltip: { mode:'index', intersect:false },
    },
  };

  if (_srcChartView === 'stacked') {
    const datasets = [
      ...sourceDatasets.map(({label, color, data}) => ({
        label, data,
        backgroundColor: color,
        stack: 'transfers',
        borderRadius: 2,
        borderWidth: 0,
      })),
      ...(hasUntagged ? [{
        label: 'Untagged', data: untaggedData,
        backgroundColor: UNTAGGED_COLOR,
        stack: 'transfers',
        borderRadius: 2, borderWidth: 0,
      }] : []),
    ];
    charts.wk_srcInsight = new Chart(canvas, {
      type: 'bar',
      data: { labels: wkLabels, datasets },
      options: {
        ...commonOpts,
        scales: {
          x: { grid:{display:false}, ticks:{font:{size:10}}, stacked:true },
          y: { beginAtZero:true, stacked:true, ticks:{precision:0, font:{size:10}} },
        },
      },
    });
  } else {
    const datasets = [
      ...sourceDatasets.map(({label, color, data}) => ({
        label, data,
        borderColor: color,
        backgroundColor: color + '22',
        pointRadius: 3, fill: false, tension: 0.3,
      })),
      ...(hasUntagged ? [{
        label: 'Untagged', data: untaggedData,
        borderColor: UNTAGGED_COLOR,
        backgroundColor: UNTAGGED_COLOR + '22',
        pointRadius: 3, fill: false, tension: 0.3,
      }] : []),
    ];
    charts.wk_srcInsight = new Chart(canvas, {
      type: 'line',
      data: { labels: wkLabels, datasets },
      options: {
        ...commonOpts,
        scales: {
          x: { grid:{display:false}, ticks:{font:{size:10}} },
          y: { beginAtZero:true, ticks:{precision:0, font:{size:10}} },
        },
      },
    });
  }
}

        <div style="border-top:1px solid var(--border);padding-top:12px">

function renderWeeklyChart(canvasId, weeks, metric, label, keyPrefix = 'wk', opts = {}) {
  destroyChart(keyPrefix + '_' + metric);
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  const money    = !!opts.money;     // format as currency
  const noTarget = !!opts.noTarget;  // metric has no weekly target line

  const labels  = weeks.map(w => weekLabel(w.weekStart));
  const values  = weeks.map(w => Number(w[metric]) || 0);
  const targets = noTarget ? [] : weeks.map(w => getTargetForWeek(metric, w.weekStart));
  // Only draw a goal line when a real target exists (0 / unset hides it)
  const showTarget = !noTarget && targets.some(t => t > 0);

  // Red = negative | Green = at/above target | Blue = positive but below target (or no target)
  const bgColors = values.map((v, i) => {
    if (v < 0)                                            return 'rgba(229,62,62,.85)';  // red — negative
    if (showTarget && targets[i] > 0 && v >= targets[i]) return 'rgba(29,158,117,.85)'; // teal/green — hit
    return 'rgba(59,100,168,.78)';                                                       // blue — below/no target
  });

  const datasets = [{ label, data: values, backgroundColor: bgColors, borderRadius: 4, order: 1 }];
  if (showTarget) {
    datasets.push({
      label: 'Target', type: 'line', data: targets,
      borderColor: '#BA7517', borderDash: [6, 4], borderWidth: 2,
      pointRadius: 0, fill: false, tension: 0, order: 0,
    });
  }

  const fmtVal  = money ? (v => fmt(v)) : (v => v);
  const fmtTick = money
    ? (v => {
        const a = Math.abs(v);
        if (a >= 1000) { const k = v/1000; return '$' + (k % 1 === 0 ? k.toFixed(0) : k.toFixed(1)) + 'k'; }
        return '$' + v;
      })
    : (v => v);

  charts[keyPrefix + '_' + metric] = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmtVal(ctx.raw)}` } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 10 }, callback: fmtTick } },
      },
    },
  });
}

let _weekEditId = null;  // null = new entry

  _weekEditId = id || null;
  document.getElementById('weekModalOverlay').style.display = 'flex';
  renderWeekModal();
}
function closeWeekModal() {
  document.getElementById('weekModalOverlay').style.display = 'none';

}
function weekOverlayClick(e) {
  if (e.target === document.getElementById('weekModalOverlay')) closeWeekModal();
}

function renderWeekModal() {
  const existing    = _weekEditId ? weeklyEntries.find(w => w.id === _weekEditId) : null;
  const defaultDate = existing ? existing.weekStart : getCurrentMondayISO();

  // Build the source list shown in the modal: current sources, plus any
  // "legacy" sources still carrying data on this entry under names no longer
  // in the active source list. This keeps a renamed/removed source's numbers
  // from being silently zeroed when an old week is re-saved.
  const curSrcs    = settings.transferSources || [];
  const legacySrcs = (existing && existing.sources)
    ? Object.keys(existing.sources).filter(k => !curSrcs.includes(k) && (Number(existing.sources[k]) || 0) !== 0)
    : [];
  _weekModalSrcList = [...curSrcs, ...legacySrcs];
  const now  = new Date();
  const y = now.getFullYear(), m = now.getMonth() + 1;
  const mT  = monthlyTotal('transfers',    y, m);
  const mBP = monthlyTotal('blisterPacks', y, m);
  const mRx = monthlyTotal('rxCount',      y, m);
  const wTT  = settings.transfersWeeklyTarget    || 0;
  const wBPT = settings.blisterPacksWeeklyTarget  || 0;
  const wRxT = settings.rxWeeklyTarget            || 0;

  function mtdCell(lbl, val, tgt) {
    const p = tgt > 0 ? Math.min(100, (val / tgt) * 100) : 0;
    const color = p >= 100 ? 'var(--teal)' : 'var(--navy)';
    return `<div style="background:var(--bg);border-radius:8px;padding:10px;text-align:center">

      <div style="font-size:1.15rem;font-weight:800;color:${color}">${val}</div>

        <label>Week Starting (select any day — auto-snaps to Monday)</label>
        <input type="date" id="wkDate" value="${defaultDate}" onchange="wkSnapMonday()">
        <div class="hint" id="wkDateHint" style="color:var(--teal)"></div>
      </div>

            const isLegacy = !(settings.transferSources||[]).includes(src);
            return `
            <div>
              <div style="font-size:.65rem;color:var(--light);margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em">${esc(src)}${isLegacy ? ' <span style="color:var(--amber)">(archived)</span>' : ''}</div>
              <input type="number" id="wkSrc_${i}" min="0" step="1"

        </div>

          <span style="font-size:.68rem;color:var(--light);text-transform:uppercase;letter-spacing:.05em">Total Transfers</span>

        ${mtdCell('Transfers', mT, Math.round(wTT*4.33))}

        ${mtdCell('Rx Count', mRx, Math.round(wRxT*4.33))}
      </div>

    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeWeekModal()">Cancel</button>
      <button class="btn btn-success" onclick="saveWeekEntry()">${existing ? 'Save Changes' : 'Add Week'}</button>
    </div>
  `;
  wkSnapMonday();
}

function wkSnapMonday() {
  const inp = document.getElementById('wkDate');
  if (!inp || !inp.value) return;
  inp.value = getMondayISO(inp.value);
  const hint = document.getElementById('wkDateHint');
  if (hint) hint.textContent = 'Week: ' + weekLabel(inp.value);
}

function calcTransferTotal() {
  const total = _weekModalSrcList.reduce((sum, _, i) => sum + (parseInt(document.getElementById('wkSrc_' + i)?.value) || 0), 0);
  const el    = document.getElementById('wkTransfersTotal');
  if (el) el.textContent = total;
}

function saveWeekEntry() {
  const dateVal      = document.getElementById('wkDate')?.value;
  const blisterPacks = parseInt(document.getElementById('wkBP')?.value)  || 0;
  const rxCount      = parseInt(document.getElementById('wkRx')?.value)   || 0;
  const feeMarkup    = parseFloat(document.getElementById('wkFM')?.value) || 0;
  const weeklyNote   = (document.getElementById('wkNote')?.value || '').trim();

  // Collect per-source transfer counts (current + legacy sources, so renamed/
  // removed sources keep their data and the total is never silently zeroed)
  const sourcesData = {};
  let totalTransfers = 0;
  _weekModalSrcList.forEach((src, i) => {
    const v = parseInt(document.getElementById('wkSrc_' + i)?.value) || 0;
    if (v !== 0 || (settings.transferSources||[]).includes(src)) sourcesData[src] = v;
    totalTransfers += v;
  });

  if (!dateVal) { alert('Please select a date.'); return; }
  const weekStart = getMondayISO(dateVal);

  // Duplicate check (skip self when editing)
  const dupIdx = weeklyEntries.findIndex(
    w => w.weekStart === weekStart && w.id !== _weekEditId
  );
  if (dupIdx >= 0) {
    if (!confirm(`A record for the week of ${weekLabel(weekStart)} already exists. Replace it?`)) return;
    weeklyEntries.splice(dupIdx, 1);
  }

  const record = {
    id:           _weekEditId || ('w' + Date.now()),
    weekStart,
    transfers:    totalTransfers,  // backward compat — used by existing charts and rolling avg
    sources:      sourcesData,     // per-source breakdown for insight chart
    blisterPacks,
    rxCount,
    feeMarkup,
    weeklyNote,
    enteredAt:    new Date().toISOString(),
  };

  if (_weekEditId) {
    const idx = weeklyEntries.findIndex(w => w.id === _weekEditId);
    if (idx >= 0) weeklyEntries[idx] = record; else weeklyEntries.push(record);
  } else {
    weeklyEntries.push(record);
  }

  saveWeeklyEntries();
  closeWeekModal();

  // Check celebrations
  const tTgt  = getTargetForWeek('transfers',    weekStart);
  const bpTgt = getTargetForWeek('blisterPacks', weekStart);
  const rxTgt = getTargetForWeek('rxCount',      weekStart);
  const fmTgt = getTargetForWeek('feeMarkup',    weekStart);
  const hits  = [];
  if (tTgt  > 0 && totalTransfers >= tTgt)  hits.push(`Transfers hit! (${totalTransfers} / ${tTgt} target)`);
  if (bpTgt > 0 && blisterPacks >= bpTgt) hits.push(`Blister Packs hit! (${blisterPacks} / ${bpTgt} target)`);
  if (rxTgt > 0 && rxCount      >= rxTgt) hits.push(`Rx Count hit! (${rxCount} / ${rxTgt} target)`);
  if (fmTgt > 0 && feeMarkup    >= fmTgt) hits.push(`Fee + Markup hit! (${fmt(feeMarkup)} / ${fmt(fmTgt)} target)`);
  if (hits.length) showCelebration(hits);

  navigate('weekly');
}

async function deleteWeekEntry(id) {
  if (!confirm('Delete this week\'s entry?')) return;
  weeklyEntries = weeklyEntries.filter(w => w.id !== id);
  saveWeeklyEntries();
  navigate('weekly');
}

// ================================================================
// AUTH
// ================================================================
function friendlyAuthError(code) {
  const map = {
    'auth/user-not-found':      'No account found for that email.',
    'auth/wrong-password':      'Incorrect password.',
    'auth/invalid-email':       'Invalid email address.',
    'auth/too-many-requests':   'Too many attempts. Please wait a moment and try again.',
    'auth/network-request-failed': 'Network error. Check your connection.',
    'auth/invalid-credential':  'Incorrect email or password.',
    'auth/invalid-login-credentials': 'Incorrect email or password.',
    'auth/missing-password':    'Enter your password.',
    'auth/user-disabled':       'This account has been disabled. Contact the pharmacy owner.',
    'auth/internal-error':      'The sign-in service had a problem. Please try again.',
  };
  // No code at all means the failure never reached Firebase (e.g. the SDK is
  // missing) — returning undefined here used to blank the message entirely.
  return map[code] || (code ? 'Sign-in error (' + code + ').' : 'Could not reach the sign-in service. Reload the page and try again.');
}

function setAuthLoading(on) {
  document.getElementById('authLoading').style.display = on ? 'flex' : 'none';
  document.getElementById('signInBtn').style.display   = on ? 'none' : 'flex';
  // Also hide/show email form buttons
  const emailBtn = document.getElementById('emailSignInBtn');
  if (emailBtn) emailBtn.style.display = on ? 'none' : 'block';
}

// Firebase fires onAuthStateChanged only when the signed-in uid CHANGES. After
// a failed data load the user is still signed in behind the gate, so signing in
// again as the same person never reached the handler and the spinner spun
// forever. In exactly that case, run the handler ourselves.
// _authGen bumps on every auth change so a run that has been overtaken (signed
// out, or another user signed in) can tell, after an await, that it must not
// touch the UI. _authRunning keeps a second submit from starting a parallel run.
let _authHandler = null;
let _authGen     = 0;
let _authRunning = false;
function rerunAuthIfSameUser(prevUid, cred) {
  const u = cred && cred.user;
  if (u && prevUid && u.uid === prevUid && _authHandler && !_authRunning) _authHandler(u);
}

// Reset emails come from Firebase's default sender, which Microsoft 365 often
// files as Junk or quarantines. The continue URL puts a button back to the app
// on the "password changed" page; if the domain is ever not authorised for
// that, send the plain email rather than failing the reset.
const RESET_SENDER   = 'noreply@escarpment-financials.firebaseapp.com';
const RESET_CONTINUE = { url: 'https://metrics.escarpmentpharmasave.ca/' };
async function sendPasswordReset(email) {
  try {
    await auth.sendPasswordResetEmail(email, RESET_CONTINUE);
  } catch (err) {
    if (err && /continue-uri|unauthorized-domain/.test(err.code || '')) await auth.sendPasswordResetEmail(email);
    else throw err;
  }
}

// Google sign-in must lead with the POPUP flow.
//
// This app is served from metrics.escarpmentpharmasave.ca, but Firebase's auth
// handler lives on escarpment-financials.firebaseapp.com — a different origin.
// signInWithRedirect hands off to that other origin and needs to read state back
// afterwards, which Chrome and Safari now block or partition as third-party
// storage. The result is a silent failure: you go to Google, pick an account,
// come back, and the app still shows the sign-in screen with no error at all.
// (Firebase's own guidance is to use the popup unless you can proxy /__/auth/ on
// your own domain, which GitHub Pages cannot do.)
//
// Redirect is kept only for the one case the popup genuinely cannot serve — a
// browser that blocks or does not support popups.
function doSignIn() {
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  errEl.style.color = '#fca5a5';
  setAuthLoading(true);
  const prevUid = auth.currentUser && auth.currentUser.uid;

  const REDIRECT_FALLBACK = [
    'auth/popup-blocked',
    'auth/operation-not-supported-in-this-environment',
    'auth/web-storage-unsupported',
  ];
  // Closing the popup or double-clicking the button is a normal user action,
  // not an error worth shouting about.
  const BENIGN = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request'];

  auth.signInWithPopup(provider).then(cred => rerunAuthIfSameUser(prevUid, cred)).catch(err => {
    if (BENIGN.includes(err.code)) { setAuthLoading(false); return; }

    if (REDIRECT_FALLBACK.includes(err.code)) {
      errEl.style.color = '#fca5a5';
      errEl.textContent = 'Popup blocked — redirecting you to Google…';
      auth.signInWithRedirect(provider).catch(err2 => {
        errEl.textContent = 'Google sign-in failed: ' + (err2.message || err2.code);
        setAuthLoading(false);
      });
      return;
    }

    errEl.textContent = 'Google sign-in failed: ' + (err.message || err.code);
    setAuthLoading(false);
  });
}

async function doEmailSignIn() {
  if (_authRunning) return;        // already checking access — a second submit would race it
  const errEl    = document.getElementById('authError');
  errEl.style.color = '#fca5a5';   // a "reset sent" message leaves it green
  const email    = (document.getElementById('authEmail').value    || '').trim();
  const password = (document.getElementById('authPassword').value || '');
  if (!email || !password) {
    errEl.textContent = 'Enter your email and password.';
    return;
  }
  errEl.textContent = '';
  setAuthLoading(true);
  const prevUid = auth.currentUser && auth.currentUser.uid;
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    rerunAuthIfSameUser(prevUid, cred);   // otherwise onAuthStateChanged handles the rest
  } catch (err) {
    const code = err && err.code;
    errEl.textContent = code === 'auth/too-many-requests'
      ? 'Too many attempts, so sign-in is paused for a while. Wait a few minutes and try again. If it stays locked, use "Forgot password?" above: resetting your password lifts an account lock.'
      : friendlyAuthError(code);
    setAuthLoading(false);
  }
}

async function doForgotPassword(btn) {
  const errEl = document.getElementById('authError');
  const email = (document.getElementById('authEmail').value || '').trim();
  if (!email) {
    errEl.style.color = '#fca5a5';
    errEl.textContent = 'Enter your email address above first.';
    return;
  }
  if (btn) btn.disabled = true;   // repeated taps sent several emails
  try {
    await sendPasswordReset(email);
    // Firebase no longer says whether the address has an account (email
    // enumeration protection), so a typo also "succeeds". Word it honestly.
    errEl.style.color = '#86efac';
    errEl.textContent = 'If ' + email + ' has an account, a reset link is on its way from ' + RESET_SENDER +
      '. Check Junk and Quarantine too, and use the newest link.';
  } catch (err) {
    errEl.style.color = '#fca5a5';
    errEl.textContent = 'Could not send reset email: ' + friendlyAuthError(err && err.code);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function doChangePassword() {
  const pw1 = document.getElementById('pwNew').value;
  const pw2 = document.getElementById('pwConfirm').value;
  const errEl = document.getElementById('pwChangeError');
  errEl.textContent = '';
  if (pw1.length < 8)  { errEl.textContent = 'Password must be at least 8 characters.'; return; }
  if (pw1 !== pw2)     { errEl.textContent = 'Passwords do not match.'; return; }
  const curEl = document.getElementById('pwCurrent');
  const user  = auth.currentUser;
  if (!user) {   // signed out underneath the overlay — nothing to change
    document.getElementById('pwChangeOverlay').style.display = 'none';
    return;
  }
  try {
    // Firebase only lets a password change through within a few minutes of a
    // real sign-in. Someone arriving on a remembered session (days later, same
    // browser) is refused with requires-recent-login — so once that has happened,
    // confirm who they are with the password they already have, then retry.
    if (curEl.style.display !== 'none') {
      if (!curEl.value) { errEl.textContent = 'Enter your current password first.'; return; }
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, curEl.value);
      await user.reauthenticateWithCredential(cred);
    }
    await user.updatePassword(pw1);
    // The password is already changed at this point. users/ is owner-write-only,
    // so clearing the flag there is normally refused for staff — which used to
    // bring this overlay back on every visit. Their own loginActivity doc IS
    // writable, so record the change there too; either write is enough.
    const email = user.email;
    const [flagRes, markRes] = await Promise.allSettled([
      db.collection(FS_USERS).doc(email).update({ mustChangePassword: false }),
      db.collection(FS_LOGINS).doc(email).set({
        passwordSetAt:  new Date().toISOString(),   // shown to the owner
        passwordSetFor: (userRecord && userRecord.mustChangePasswordSince) || null,   // what it answered
      }, { merge: true }),
    ]);
    if (flagRes.status === 'rejected') console.warn('[Auth] could not clear mustChangePassword:', flagRes.reason && (flagRes.reason.code || flagRes.reason.message));
    if (markRes.status === 'rejected') console.warn('[Auth] could not record passwordSetAt:', markRes.reason && (markRes.reason.code || markRes.reason.message));
    if (userRecord) userRecord.mustChangePassword = false;
    document.getElementById('pwChangeOverlay').style.display = 'none';
    if (flagRes.status === 'rejected' && markRes.status === 'rejected') {
      alert('Your password was changed successfully.\n\nThis prompt may still appear next time you sign in, because the app could not save that you have set it. If it does, let the pharmacy owner know.');
    }
  } catch (err) {
    const code = err && err.code;
    if (code === 'auth/requires-recent-login') {
      curEl.style.display = 'block';
      curEl.focus();
      errEl.textContent = 'For security, enter the password you currently sign in with, then press Save again.';
    } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') {
      errEl.textContent = 'That password is not right. Enter the one you signed in with today, or sign out and use "Forgot password?".';
    } else if (code === 'auth/weak-password') {
      errEl.textContent = 'That password is too weak. Try a longer one.';
    } else if (code === 'auth/too-many-requests') {
      errEl.textContent = 'Too many attempts. Wait a few minutes and try again.';
    } else if (code === 'auth/network-request-failed') {
      errEl.textContent = 'No connection. Check your internet and try again.';
    } else {
      errEl.textContent = 'Could not update password: ' + (err.message || code);
    }
  }
}

// The password overlay sits above the header, so without this there is no way to

  location.reload();
}

function doSignOut() {

}
